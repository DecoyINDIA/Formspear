<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 24" width="100%" height="24" fill="none">
  <defs>
    <linearGradient id="div-pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0" />
      <stop offset="30%" stop-color="#10B981" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#10B981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </linearGradient>

    <style>
      @keyframes beam-travel {
        0% { transform: translateX(-400px); }
        100% { transform: translateX(400px); }
      }
      .pulse-segment {
        animation: beam-travel 4s ease-in-out infinite alternate;
      }
      @media (prefers-reduced-motion: reduce) {
        .pulse-segment { animation: none !important; }
      }
    </style>
  </defs>

  <!-- Baseline -->
  <line x1="40" y1="12" x2="960" y2="12" stroke="#16382E" stroke-width="1" opacity="0.6" />

  <!-- Animated Traveling Beam -->
  <g class="pulse-segment">
    <line x1="300" y1="12" x2="700" y2="12" stroke="url(#div-pulse)" stroke-width="2" />
    <circle cx="500" cy="12" r="3.5" fill="#34D399" />
  </g>
</svg>