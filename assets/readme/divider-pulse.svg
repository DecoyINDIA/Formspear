<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 24" width="100%" height="24" fill="none">
  <defs>
    <linearGradient id="div-laser-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0" />
      <stop offset="35%" stop-color="#10B981" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#34D399" stop-opacity="1" />
      <stop offset="65%" stop-color="#10B981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </linearGradient>

    <style>
      @keyframes beam-slide {
        0% { transform: translateX(-450px); }
        100% { transform: translateX(450px); }
      }
      .laser-beam {
        animation: beam-slide 4s ease-in-out infinite alternate;
      }
      @media (prefers-reduced-motion: reduce) {
        .laser-beam { animation: none !important; }
      }
    </style>
  </defs>

  <!-- Baseline -->
  <line x1="30" y1="12" x2="1070" y2="12" stroke="#14362C" stroke-width="1" stroke-opacity="0.6" />

  <!-- Animated Laser Beam Segment -->
  <g class="laser-beam">
    <line x1="350" y1="12" x2="750" y2="12" stroke="url(#div-laser-grad)" stroke-width="2" />
    <circle cx="550" cy="12" r="3.5" fill="#34D399" />
  </g>
</svg>
