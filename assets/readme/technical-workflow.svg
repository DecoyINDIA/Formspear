<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="tw-glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#040907" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="tw-progress-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="35%" stop-color="#34D399" />
      <stop offset="70%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>

    <style>
      @keyframes progress-travel {
        0% { stroke-dashoffset: 960; }
        45% { stroke-dashoffset: 0; }
        90%, 100% { stroke-dashoffset: 0; }
      }
      @keyframes station-breathe {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px rgba(16, 185, 129, 0.3)); }
        50% { transform: scale(1.08); filter: drop-shadow(0 0 14px rgba(52, 211, 153, 0.85)); }
      }
      @keyframes cursor-blink-terminal {
        0%, 100% { opacity: 0; }
        50% { opacity: 1; }
      }
      @keyframes checkmark-appear {
        0%, 40% { opacity: 0.3; }
        50%, 100% { opacity: 1; }
      }

      .stepper-line {
        stroke-dasharray: 960;
        animation: progress-travel 6.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .milestone-active {
        animation: station-breathe 4s ease-in-out infinite;
      }
      .cursor-blink {
        animation: cursor-blink-terminal 0.9s steps(2, start) infinite;
      }
      .check-fade {
        animation: checkmark-appear 6.5s ease-in-out infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .stepper-line, .milestone-active, .cursor-blink, .check-fade {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Frame Background -->
  <rect width="1100" height="360" rx="16" fill="#040907" />
  <rect width="1100" height="360" rx="16" fill="url(#tw-glow)" />
  <rect width="1100" height="360" rx="16" stroke="#16382E" stroke-width="1.2" />

  <!-- Instrument Header Bar -->
  <g transform="translate(36, 26)">
    <circle cx="6" cy="6" r="4.5" fill="#38BDF8" />
    <text x="20" y="10" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="1.2">DEVELOPER &amp; OPERATOR LIFECYCLE</text>
    <text x="280" y="10" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500" fill="#64748B">Zero-friction progression from instantaneous local boot to resilient production cutover</text>
  </g>

  <!-- Stepper Track Baseline -->
  <line x1="70" y1="92" x2="1030" y2="92" stroke="#123B2F" stroke-width="3" />
  <line x1="70" y1="92" x2="1030" y2="92" stroke="url(#tw-progress-grad)" stroke-width="3" class="stepper-line" />

  <!-- ==================== 4 LIFECYCLE MILESTONES ==================== -->

  <!-- Milestone 01: Instant Local Boot -->
  <g transform="translate(70, 92)">
    <circle cx="0" cy="0" r="18" fill="#061E17" stroke="#10B981" stroke-width="2" class="milestone-active" />
    <text x="0" y="5" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="800" fill="#34D399">01</text>

    <!-- Card -->
    <g transform="translate(-10, 30)">
      <rect width="215" height="185" rx="8" fill="#081E19" stroke="#1A4F40" stroke-width="1" />
      <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">Zero-Config Boot</text>
      <text x="14" y="42" font-family="sans-serif" font-size="10" fill="#94A3B8">Local-first atomic JSON mode</text>

      <!-- Terminal Screen -->
      <rect x="14" y="54" width="187" height="66" rx="5" fill="#030A08" stroke="#10362B" stroke-width="0.8" />
      <text x="22" y="74" font-family="ui-monospace, monospace" font-size="9.5" fill="#34D399">$ npm start</text>
      <text x="22" y="92" font-family="ui-monospace, monospace" font-size="9" fill="#94A3B8">FeedbackOS ready :4173</text>
      <text x="22" y="108" font-family="ui-monospace, monospace" font-size="8.5" fill="#6EE7B7">admin@feedbackos.local <tspan fill="#34D399" class="cursor-blink">_</tspan></text>

      <!-- Sub-label -->
      <text x="14" y="142" font-family="sans-serif" font-size="9.5" fill="#CBD5E1">✓ Auto-seeds Super Admin</text>
      <text x="14" y="158" font-family="sans-serif" font-size="9.5" fill="#CBD5E1">✓ Zero database prerequisites</text>
      <text x="14" y="174" font-family="sans-serif" font-size="9.5" fill="#CBD5E1">✓ Complete UI fully interactive</text>
    </g>
  </g>

  <!-- Milestone 02: Visual Builder & Schema -->
  <g transform="translate(370, 92)">
    <circle cx="0" cy="0" r="18" fill="#061E17" stroke="#34D399" stroke-width="2" class="milestone-active" />
    <text x="0" y="5" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="800" fill="#34D399">02</text>

    <!-- Card -->
    <g transform="translate(-10, 30)">
      <rect width="215" height="185" rx="8" fill="#081E19" stroke="#1A4F40" stroke-width="1" />
      <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">Visual Builder</text>
      <text x="14" y="42" font-family="sans-serif" font-size="10" fill="#94A3B8">23 question primitives &amp; logic</text>

      <!-- Mini Builder Preview -->
      <g transform="translate(14, 54)">
        <rect width="187" height="66" rx="5" fill="#030A08" stroke="#10362B" stroke-width="0.8" />
        <rect x="8" y="10" width="171" height="20" rx="3" fill="#0C261F" stroke="#1E5C4A" stroke-width="0.6" />
        <text x="16" y="24" font-family="sans-serif" font-size="8.5" font-weight="600" fill="#ECFDF5">Q1: NPS Scale (0-10)</text>
        <rect x="8" y="36" width="171" height="20" rx="3" fill="#0C261F" stroke="#1E5C4A" stroke-width="0.6" />
        <text x="16" y="50" font-family="sans-serif" font-size="8.5" font-weight="600" fill="#ECFDF5">Q2: Location Auto-Pin (BLR)</text>
      </g>

      <text x="14" y="142" font-family="sans-serif" font-size="9.5" fill="#CBD5E1">✓ Bounded Undo/Redo Engine</text>
      <text x="14" y="158" font-family="sans-serif" font-size="9.5" fill="#CBD5E1">✓ Conditional skip rule trees</text>
      <text x="14" y="174" font-family="sans-serif" font-size="9.5" fill="#CBD5E1">✓ Multi-language (?lang=)</text>
    </g>
  </g>

  <!-- Milestone 03: Verification Gate -->
  <g transform="translate(670, 92)">
    <circle cx="0" cy="0" r="18" fill="#08202A" stroke="#38BDF8" stroke-width="2" class="milestone-active" />
    <text x="0" y="5" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="800" fill="#38BDF8">03</text>

    <!-- Card -->
    <g transform="translate(-10, 30)">
      <rect width="215" height="185" rx="8" fill="#081E24" stroke="#164A59" stroke-width="1" />
      <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">Verification Gate</text>
      <text x="14" y="42" font-family="sans-serif" font-size="10" fill="#94A3B8">Automated test &amp; load harness</text>

      <!-- Terminal Test Suite Box -->
      <rect x="14" y="54" width="187" height="66" rx="5" fill="#030D11" stroke="#0E3844" stroke-width="0.8" />
      <text x="22" y="74" font-family="ui-monospace, monospace" font-size="9" fill="#38BDF8">$ npm test</text>
      <text x="22" y="92" font-family="ui-monospace, monospace" font-size="9" fill="#7DD3FC">✔ 59 suites passed (0 fail)</text>
      <text x="22" y="108" font-family="ui-monospace, monospace" font-size="8.5" fill="#34D399" class="check-fade">✔ Concurrency smoke: &lt;1.2ms</text>

      <text x="14" y="142" font-family="sans-serif" font-size="9.5" fill="#CBD5E1">✓ 39 PostgreSQL tables pass</text>
      <text x="14" y="158" font-family="sans-serif" font-size="9.5" fill="#CBD5E1">✓ Checksum JSON backup test</text>
      <text x="14" y="174" font-family="sans-serif" font-size="9.5" fill="#CBD5E1">✓ Headless visual smoke clean</text>
    </g>
  </g>

  <!-- Milestone 04: Production Cutover -->
  <g transform="translate(970, 92)">
    <circle cx="0" cy="0" r="18" fill="#1C1833" stroke="#A78BFA" stroke-width="2" class="milestone-active" />
    <text x="0" y="5" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="800" fill="#A78BFA">04</text>

    <!-- Card -->
    <g transform="translate(-10, 30)">
      <rect width="215" height="185" rx="8" fill="#141226" stroke="#372F5E" stroke-width="1" />
      <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">Production Cutover</text>
      <text x="14" y="42" font-family="sans-serif" font-size="10" fill="#94A3B8">Railway / Docker deployment</text>

      <!-- Deploy Badge Screen -->
      <rect x="14" y="54" width="187" height="66" rx="5" fill="#090814" stroke="#221D42" stroke-width="0.8" />
      <text x="22" y="74" font-family="ui-monospace, monospace" font-size="9" fill="#A78BFA">$ railway up</text>
      <text x="22" y="92" font-family="ui-monospace, monospace" font-size="8.5" fill="#C7D2FE">Advisory lock: GRANTED</text>
      <text x="22" y="108" font-family="ui-monospace, monospace" font-size="8.5" fill="#34D399">Deploy: HEALTHY (numRep: 1)</text>

      <text x="14" y="142" font-family="sans-serif" font-size="9.5" fill="#CBD5E1">✓ Single-writer architecture</text>
      <text x="14" y="158" font-family="sans-serif" font-size="9.5" fill="#CBD5E1">✓ Sentry exception telemetry</text>
      <text x="14" y="174" font-family="sans-serif" font-size="9.5" fill="#CBD5E1">✓ BullMQ async worker pool</text>
    </g>
  </g>
</svg>
