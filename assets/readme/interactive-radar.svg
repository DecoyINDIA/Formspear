<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="radar-crt-bg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0B2B21" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#061A14" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#030A08" />
    </radialGradient>
    <linearGradient id="crt-sweep-tail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0" />
      <stop offset="60%" stop-color="#10B981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="spectrum-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="60%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <pattern id="radar-micro-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#0E3327" stroke-width="0.5" stroke-opacity="0.6" />
    </pattern>

    <style>
      @keyframes radar-beam-turn {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes blip-beacon-pulse {
        0%, 100% { transform: scale(1); opacity: 0.35; }
        50% { transform: scale(1.8); opacity: 1; }
      }
      @keyframes osc-breathe {
        0%, 100% { transform: scaleY(0.85) translateY(3px); }
        50% { transform: scaleY(1.2) translateY(-3px); }
      }
      @keyframes eq-bounce-1 {
        0%, 100% { height: 18px; }
        50% { height: 58px; }
      }
      @keyframes eq-bounce-2 {
        0%, 100% { height: 48px; }
        50% { height: 22px; }
      }
      @keyframes eq-bounce-3 {
        0%, 100% { height: 32px; }
        50% { height: 68px; }
      }
      @keyframes term-cursor-flash {
        0%, 100% { opacity: 0; }
        50% { opacity: 1; }
      }
      @keyframes active-pill-glow {
        0%, 100% { fill: #064E3B; stroke: #34D399; }
        50% { fill: #047857; stroke: #6EE7B7; }
      }

      .radar-arm {
        transform-origin: 205px 245px;
        animation: radar-beam-turn 5s linear infinite;
      }
      .beacon-dot {
        animation: blip-beacon-pulse 2.4s ease-in-out infinite;
      }
      .osc-line {
        transform-origin: 570px 240px;
        animation: osc-breathe 3s ease-in-out infinite;
      }
      .eq-bar-1 { animation: eq-bounce-1 1.6s ease-in-out infinite; }
      .eq-bar-2 { animation: eq-bounce-2 1.4s ease-in-out infinite 0.2s; }
      .eq-bar-3 { animation: eq-bounce-3 1.8s ease-in-out infinite 0.4s; }
      .prompt-cursor { animation: term-cursor-flash 0.9s steps(2, start) infinite; }
      .tactile-pill { animation: active-pill-glow 4s ease-in-out infinite; }

      @media (prefers-reduced-motion: reduce) {
        .radar-arm, .beacon-dot, .osc-line, .eq-bar-1, .eq-bar-2, .eq-bar-3, .prompt-cursor, .tactile-pill {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Frame Background -->
  <rect width="1100" height="440" rx="16" fill="#040907" />
  <rect width="1100" height="440" rx="16" stroke="#16382E" stroke-width="1.2" />

  <!-- Instrument Header Bar -->
  <g transform="translate(36, 26)">
    <circle cx="6" cy="6" r="4.5" fill="#10B981" />
    <text x="20" y="10" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#34D399" letter-spacing="1.2">SPEAR TELEMETRY COCKPIT &amp; DIAGNOSTIC FLIGHT DECK</text>
    <text x="380" y="10" font-family="ui-monospace, monospace" font-size="10" fill="#64748B">[SYS_DIAG: ONLINE] • ADVISORY_LOCK: GRANTED • SINGLE_PROCESS: OPTIMAL</text>
  </g>

  <!-- Tactile Interactive-Looking Control Filter Buttons -->
  <g transform="translate(36, 56)">
    <!-- Pill 1: Live Radar (Active) -->
    <g class="tactile-pill">
      <rect x="0" y="0" width="155" height="28" rx="14" fill="#064E3B" stroke="#34D399" stroke-width="1" />
      <circle cx="16" cy="14" r="3.5" fill="#34D399" />
      <text x="28" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="700" fill="#ECFDF5">⚡ LIVE RADAR</text>
    </g>

    <!-- Pill 2: 14 Branch Hubs -->
    <g transform="translate(168, 0)">
      <rect x="0" y="0" width="160" height="28" rx="14" fill="#071914" stroke="#18483B" stroke-width="1" />
      <circle cx="16" cy="14" r="3.5" fill="#38BDF8" />
      <text x="28" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" fill="#E2E8F0">📍 14 BRANCH HUBS</text>
    </g>

    <!-- Pill 3: Zero-Trust Cipher -->
    <g transform="translate(340, 0)">
      <rect x="0" y="0" width="175" height="28" rx="14" fill="#071914" stroke="#18483B" stroke-width="1" />
      <circle cx="16" cy="14" r="3.5" fill="#F59E0B" />
      <text x="28" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" fill="#E2E8F0">🛡️ ZERO-TRUST CIPHER</text>
    </g>

    <!-- Pill 4: Stress Simulator -->
    <g transform="translate(528, 0)">
      <rect x="0" y="0" width="180" height="28" rx="14" fill="#071914" stroke="#18483B" stroke-width="1" />
      <circle cx="16" cy="14" r="3.5" fill="#A78BFA" />
      <text x="28" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" fill="#E2E8F0">⚡ 100 SUBS/SEC SIM</text>
    </g>

    <!-- Real-time HUD stats (Right) -->
    <text x="1028" y="18" text-anchor="end" font-family="ui-monospace, monospace" font-size="10" fill="#94A3B8">PULSE: <tspan fill="#34D399">60 FPS</tspan> | LATENCY: <tspan fill="#34D399">0.84ms</tspan> | CPU: <tspan fill="#38BDF8">1.8%</tspan></text>
  </g>

  <!-- ==================== LEFT CHAMBER: TACTICAL RADAR SCOPE ==================== -->
  <g transform="translate(36, 100)">
    <rect width="340" height="295" rx="10" fill="#061712" stroke="#18473A" stroke-width="1" />
    <text x="16" y="22" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#34D399">CHAMBER A • FLEET RADAR SCOPE</text>

    <!-- Radar Circle Chamber -->
    <g transform="translate(170, 150)">
      <circle cx="0" cy="0" r="110" fill="url(#radar-crt-bg)" stroke="#164A3B" stroke-width="1.2" />
      <circle cx="0" cy="0" r="110" fill="url(#radar-micro-grid)" />
      
      <!-- Distance Range Rings -->
      <circle cx="0" cy="0" r="80" stroke="#1B5B49" stroke-width="0.8" stroke-dasharray="2, 6" />
      <circle cx="0" cy="0" r="50" stroke="#1B5B49" stroke-width="0.8" stroke-dasharray="2, 4" />
      <circle cx="0" cy="0" r="20" stroke="#247861" stroke-width="0.8" />

      <!-- Crosshairs -->
      <line x1="-110" y1="0" x2="110" y2="0" stroke="#184A3B" stroke-width="0.8" />
      <line x1="0" y1="-110" x2="0" y2="110" stroke="#184A3B" stroke-width="0.8" />

      <!-- Compass Points -->
      <text x="0" y="-95" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" font-weight="700" fill="#34D399">N</text>
      <text x="0" y="102" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" font-weight="700" fill="#34D399">S</text>
      <text x="100" y="3" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" font-weight="700" fill="#34D399">E</text>
      <text x="-100" y="3" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" font-weight="700" fill="#34D399">W</text>

      <!-- Rotating Sweep Arm with Tail -->
      <g class="radar-arm">
        <line x1="0" y1="0" x2="110" y2="0" stroke="#34D399" stroke-width="1.8" />
        <polygon points="0,0 110,-35 110,0" fill="url(#crt-sweep-tail)" opacity="0.4" />
      </g>

      <!-- Active Branch Nodes on Radar -->
      <g transform="translate(42, -32)" class="beacon-dot">
        <circle cx="0" cy="0" r="4" fill="#34D399" />
        <text x="6" y="3" font-family="ui-monospace, monospace" font-size="7.5" font-weight="700" fill="#FFFFFF">BLR [98%]</text>
      </g>
      <g transform="translate(-48, 38)" class="beacon-dot">
        <circle cx="0" cy="0" r="3.5" fill="#38BDF8" />
        <text x="6" y="3" font-family="ui-monospace, monospace" font-size="7.5" font-weight="700" fill="#FFFFFF">BOM [95%]</text>
      </g>
      <g transform="translate(28, 54)" class="beacon-dot">
        <circle cx="0" cy="0" r="3" fill="#F59E0B" />
        <text x="6" y="3" font-family="ui-monospace, monospace" font-size="7.5" font-weight="700" fill="#FFFFFF">HYD [99%]</text>
      </g>
      <g transform="translate(-56, -45)" class="beacon-dot">
        <circle cx="0" cy="0" r="3" fill="#A78BFA" />
        <text x="6" y="3" font-family="ui-monospace, monospace" font-size="7.5" font-weight="700" fill="#FFFFFF">DEL [92%]</text>
      </g>
    </g>
  </g>

  <!-- ==================== CENTER CHAMBER: OSCILLOSCOPE & SPECTRUM ==================== -->
  <g transform="translate(396, 100)">
    <rect width="335" height="295" rx="10" fill="#061712" stroke="#18473A" stroke-width="1" />
    <text x="16" y="22" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#38BDF8">CHAMBER B • WAVE HARMONICS &amp; SPECTRUM</text>

    <!-- Oscilloscope Grid Screen -->
    <g transform="translate(16, 36)">
      <rect width="303" height="120" rx="6" fill="#040D0A" stroke="#123B2F" stroke-width="0.8" />
      <rect width="303" height="120" rx="6" fill="url(#radar-micro-grid)" />
      
      <!-- Oscilloscope Center Baseline -->
      <line x1="0" y1="60" x2="303" y2="60" stroke="#144A3A" stroke-width="1" stroke-dasharray="3, 3" />

      <!-- Sine Wave Signal (Real Time) -->
      <path d="M 0 60 Q 38 18 76 60 T 152 60 T 228 60 T 303 60" fill="none" stroke="#34D399" stroke-width="2" class="osc-line" />
      <!-- Secondary Harmonic Wave -->
      <path d="M 0 60 Q 25 82 50 60 T 100 60 T 150 60 T 200 60 T 250 60 T 303 60" fill="none" stroke="#38BDF8" stroke-width="1.2" opacity="0.6" class="osc-line" />

      <text x="10" y="16" font-family="ui-monospace, monospace" font-size="8.5" fill="#34D399">FREQ: 60.0 Hz</text>
      <text x="220" y="16" font-family="ui-monospace, monospace" font-size="8.5" fill="#38BDF8">AMPL: 1.02 V</text>
    </g>

    <!-- Packet Ingestion Spectrum Equalizer -->
    <g transform="translate(16, 172)">
      <text x="0" y="12" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#64748B">TRAFFIC SPECTRUM BARS (100 SUBS/S)</text>

      <!-- Equalizer Bars -->
      <g transform="translate(0, 24)">
        <rect x="0" y="0" width="12" rx="3" fill="url(#spectrum-grad)" class="eq-bar-1" />
        <rect x="18" y="0" width="12" rx="3" fill="url(#spectrum-grad)" class="eq-bar-2" />
        <rect x="36" y="0" width="12" rx="3" fill="url(#spectrum-grad)" class="eq-bar-3" />
        <rect x="54" y="0" width="12" rx="3" fill="url(#spectrum-grad)" class="eq-bar-1" />
        <rect x="72" y="0" width="12" rx="3" fill="url(#spectrum-grad)" class="eq-bar-2" />
        <rect x="90" y="0" width="12" rx="3" fill="url(#spectrum-grad)" class="eq-bar-3" />
        <rect x="108" y="0" width="12" rx="3" fill="url(#spectrum-grad)" class="eq-bar-1" />
        <rect x="126" y="0" width="12" rx="3" fill="url(#spectrum-grad)" class="eq-bar-2" />
        <rect x="144" y="0" width="12" rx="3" fill="url(#spectrum-grad)" class="eq-bar-3" />
        <rect x="162" y="0" width="12" rx="3" fill="url(#spectrum-grad)" class="eq-bar-1" />
        <rect x="180" y="0" width="12" rx="3" fill="url(#spectrum-grad)" class="eq-bar-2" />
        <rect x="198" y="0" width="12" rx="3" fill="url(#spectrum-grad)" class="eq-bar-3" />
        <rect x="216" y="0" width="12" rx="3" fill="url(#spectrum-grad)" class="eq-bar-1" />
        <rect x="234" y="0" width="12" rx="3" fill="url(#spectrum-grad)" class="eq-bar-2" />
        <rect x="252" y="0" width="12" rx="3" fill="url(#spectrum-grad)" class="eq-bar-3" />
        <rect x="270" y="0" width="12" rx="3" fill="url(#spectrum-grad)" class="eq-bar-1" />
        <rect x="288" y="0" width="12" rx="3" fill="url(#spectrum-grad)" class="eq-bar-2" />
      </g>
    </g>
  </g>

  <!-- ==================== RIGHT CHAMBER: LIVE DIAGNOSTIC TERMINAL ==================== -->
  <g transform="translate(751, 100)">
    <rect width="313" height="295" rx="10" fill="#040C09" stroke="#163E32" stroke-width="1" />
    <text x="16" y="22" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#A78BFA">CHAMBER C • KERNEL DIAGNOSTIC LOG</text>

    <!-- Terminal Screen -->
    <g transform="translate(14, 36)">
      <rect width="285" height="240" rx="6" fill="#020806" stroke="#0E2F25" stroke-width="0.8" />
      
      <!-- Terminal Output Lines -->
      <g transform="translate(14, 22)">
        <text x="0" y="0" font-family="ui-monospace, monospace" font-size="9" fill="#34D399">[SYS_OK] RAM Datastore: 36/36 synced</text>
        <text x="0" y="18" font-family="ui-monospace, monospace" font-size="9" fill="#38BDF8">[DB_DIFF] PostgreSQL Diff: 0 pending</text>
        <text x="0" y="36" font-family="ui-monospace, monospace" font-size="9" fill="#6EE7B7">[ADVISORY] Lock 0x464F524D: HELD</text>
        <text x="0" y="54" font-family="ui-monospace, monospace" font-size="9" fill="#94A3B8">[MEM_STAT] RSS: 42.1MB • Heap: 28MB</text>
        <text x="0" y="72" font-family="ui-monospace, monospace" font-size="9" fill="#CBD5E1">[QUARANTINE] EICAR scan: CLEAN</text>
        <text x="0" y="90" font-family="ui-monospace, monospace" font-size="9" fill="#F59E0B">[WEBHOOKS] Retries: 0 • HMAC: OK</text>
        <text x="0" y="108" font-family="ui-monospace, monospace" font-size="9" fill="#A78BFA">[SAML_SSO] ACS endpoint: LISTENING</text>
        
        <line x1="0" y1="124" x2="255" y2="124" stroke="#0E3025" stroke-width="0.8" />

        <!-- Command Prompt & Easter Egg -->
        <text x="0" y="146" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#34D399">&gt; formspear --ping-mesh</text>
        <text x="0" y="166" font-family="ui-monospace, monospace" font-size="9" fill="#ECFDF5">&gt; 14/14 HUBS ONLINE (0.84ms)</text>
        <text x="0" y="186" font-family="ui-monospace, monospace" font-size="9" fill="#5EEAD4">&gt; ZERO_FRAMEWORK_INTEGRITY: 100%</text>
        <text x="0" y="206" font-family="ui-monospace, monospace" font-size="9.5" fill="#34D399">&gt; ready<tspan class="prompt-cursor">_</tspan></text>
      </g>
    </g>
  </g>
</svg>
