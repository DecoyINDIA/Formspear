<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="mark-aura" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#059669" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#040907" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="facet-grad-a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="50%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="facet-grad-b" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="60%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>
    <linearGradient id="blueprint-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.1" />
    </linearGradient>

    <pattern id="diag-blueprint-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#0E2D24" stroke-width="0.6" stroke-opacity="0.5" />
      <circle cx="24" cy="24" r="0.8" fill="#1C5E4B" />
    </pattern>

    <style>
      @keyframes stroke-blueprint {
        0% { stroke-dashoffset: 560; opacity: 0.15; }
        45% { stroke-dashoffset: 0; opacity: 1; }
        90%, 100% { stroke-dashoffset: 0; opacity: 0.8; }
      }
      @keyframes compass-rotate-cw {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes compass-rotate-ccw {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes emblem-breathe {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 14px rgba(16, 185, 129, 0.4)); }
        50% { transform: scale(1.03); filter: drop-shadow(0 0 28px rgba(52, 211, 153, 0.8)); }
      }
      @keyframes measurement-flash {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      @keyframes cursor-beacon {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 1; }
      }

      .blueprint-draw {
        stroke-dasharray: 560;
        animation: stroke-blueprint 5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .compass-cw {
        transform-origin: 210px 190px;
        animation: compass-rotate-cw 18s linear infinite;
      }
      .compass-ccw {
        transform-origin: 210px 190px;
        animation: compass-rotate-ccw 14s linear infinite;
      }
      .spear-emblem-core {
        transform-origin: 210px 190px;
        animation: emblem-breathe 4s ease-in-out infinite;
      }
      .dim-callout {
        animation: measurement-flash 3s ease-in-out infinite;
      }
      .pulse-dot {
        animation: cursor-beacon 1.6s ease-in-out infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .blueprint-draw, .compass-cw, .compass-ccw, .spear-emblem-core, .dim-callout, .pulse-dot {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Frame Background -->
  <rect width="940" height="380" rx="16" fill="#040907" />
  <rect width="940" height="380" rx="16" fill="url(#diag-blueprint-grid)" />
  <rect width="940" height="380" rx="16" stroke="#16382E" stroke-width="1.2" />

  <!-- Top Technical Header -->
  <g transform="translate(36, 28)">
    <circle cx="6" cy="6" r="4.5" fill="#10B981" class="pulse-dot" />
    <text x="20" y="10" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#34D399" letter-spacing="1.2">BRAND ANATOMY &amp; GEOMETRIC SYNTHESIS</text>
    <text x="350" y="10" font-family="ui-monospace, monospace" font-size="10.5" fill="#64748B">SPEC_REV: 04 • CARTESIAN_LATTICE: LOCKED • ANGLE_OF_THRUST: 54.7°</text>
  </g>

  <!-- Vertical Divider Dividing Blueprint and Typographic Exposition -->
  <line x1="420" y1="56" x2="420" y2="350" stroke="#14362C" stroke-width="1.2" stroke-dasharray="4, 6" />

  <!-- ==================== LEFT CHAMBER: BLUEPRINT CONSTRUCTION ==================== -->
  <!-- Ambient Glow -->
  <circle cx="210" cy="190" r="140" fill="url(#mark-aura)" />

  <!-- Rotating Compass Rings with Vernier Calibrations -->
  <g class="compass-cw">
    <circle cx="210" cy="190" r="130" stroke="#154235" stroke-width="1" stroke-dasharray="3, 9" />
    <circle cx="210" cy="60" r="3.5" fill="#34D399" />
    <circle cx="210" cy="320" r="3.5" fill="#38BDF8" />
  </g>
  <g class="compass-ccw">
    <circle cx="210" cy="190" r="105" stroke="#1D5A48" stroke-width="1.2" stroke-dasharray="8, 16" opacity="0.75" />
    <circle cx="105" cy="190" r="2.5" fill="#F59E0B" />
    <circle cx="315" cy="190" r="2.5" fill="#6EE7B7" />
  </g>

  <!-- Cartesian Coordinate Grid Axis -->
  <line x1="60" y1="190" x2="360" y2="190" stroke="#184739" stroke-width="1" stroke-dasharray="2, 4" />
  <line x1="210" y1="55" x2="210" y2="325" stroke="#184739" stroke-width="1" stroke-dasharray="2, 4" />

  <!-- Blueprint Dynamic Construction Stroke -->
  <g class="blueprint-draw">
    <!-- Diamond Shield Envelope -->
    <polygon points="210,105 285,190 210,275 135,190" fill="none" stroke="#34D399" stroke-width="1.5" stroke-dasharray="6, 6" />
    <!-- Angular Force Rays -->
    <line x1="135" y1="190" x2="285" y2="190" stroke="#38BDF8" stroke-width="1.2" />
    <line x1="210" y1="105" x2="210" y2="275" stroke="#38BDF8" stroke-width="1.2" />
  </g>

  <!-- Assembled Core Emblem -->
  <g class="spear-emblem-core">
    <!-- Left Facet -->
    <polygon points="210,118 208,190 148,190" fill="url(#facet-grad-a)" opacity="0.95" />
    <polygon points="210,262 208,190 148,190" fill="#047857" opacity="0.8" />
    <!-- Right Facet -->
    <polygon points="210,118 212,190 272,190" fill="url(#facet-grad-b)" opacity="0.95" />
    <polygon points="210,262 212,190 272,190" fill="#024434" opacity="0.85" />
    <!-- Center Spine & Core Sensor -->
    <line x1="210" y1="114" x2="210" y2="266" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="210" cy="190" r="5" fill="#FFFFFF" />
    <circle cx="210" cy="190" r="2.5" fill="#10B981" />
  </g>

  <!-- Dimension Annotation Callouts -->
  <g class="dim-callout" transform="translate(68, 120)">
    <rect width="66" height="20" rx="4" fill="#09201A" stroke="#195443" stroke-width="0.8" />
    <text x="33" y="14" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" font-weight="600" fill="#34D399">θ = 54.7°</text>
  </g>
  <g class="dim-callout" transform="translate(285, 255)">
    <rect width="78" height="20" rx="4" fill="#09201A" stroke="#195443" stroke-width="0.8" />
    <text x="39" y="14" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" font-weight="600" fill="#38BDF8">ΔX = 142mm</text>
  </g>

  <!-- ==================== RIGHT CHAMBER: TYPOGRAPHIC SYNTHESIS ==================== -->
  <g transform="translate(450, 70)">
    <!-- Master Brand Typographic Lockup -->
    <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="900" fill="#FFFFFF" letter-spacing="3.5">
      FORMSPEAR
    </text>
    <circle cx="270" cy="30" r="5" fill="#10B981" class="pulse-dot" />

    <!-- Etymology Synthesis: The Tension Solved -->
    <g transform="translate(0, 68)">
      <!-- Form Box -->
      <rect x="0" y="0" width="215" height="74" rx="8" fill="#071B16" stroke="#194F40" stroke-width="1" />
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#34D399" letter-spacing="1">FORM [Structure]</text>
      <text x="14" y="40" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500" fill="#CBD5E1">Cartesian question schema, 23 input</text>
      <text x="14" y="55" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500" fill="#94A3B8">primitives &amp; deterministic logic graphs.</text>

      <!-- Spear Box -->
      <rect x="230" y="0" width="225" height="74" rx="8" fill="#071B16" stroke="#194F40" stroke-width="1" />
      <text x="244" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#38BDF8" letter-spacing="1">SPEAR [Velocity]</text>
      <text x="244" y="40" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500" fill="#CBD5E1">Kinetic trajectory: &lt;1ms ingestion,</text>
      <text x="244" y="55" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500" fill="#94A3B8">sub-12ms alerts &amp; instant synthesis.</text>
    </g>

    <!-- Chromatic & Material Palette -->
    <g transform="translate(0, 162)">
      <text x="0" y="14" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#64748B" letter-spacing="1">CHROMATIC SIGNATURE</text>
      
      <!-- Swatch 1: Obsidian Base -->
      <g transform="translate(0, 24)">
        <rect width="98" height="34" rx="6" fill="#040907" stroke="#1F473B" stroke-width="1" />
        <circle cx="16" cy="17" r="5" fill="#040907" stroke="#475569" stroke-width="1" />
        <text x="28" y="16" font-family="sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">OBSIDIAN</text>
        <text x="28" y="26" font-family="ui-monospace, monospace" font-size="8" fill="#94A3B8">#040907</text>
      </g>

      <!-- Swatch 2: Precision Emerald -->
      <g transform="translate(110, 24)">
        <rect width="105" height="34" rx="6" fill="#06241D" stroke="#10B981" stroke-width="1" />
        <circle cx="16" cy="17" r="5" fill="#10B981" />
        <text x="28" y="16" font-family="sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">EMERALD</text>
        <text x="28" y="26" font-family="ui-monospace, monospace" font-size="8" fill="#6EE7B7">#10B981</text>
      </g>

      <!-- Swatch 3: Velocity Cyan -->
      <g transform="translate(228, 24)">
        <rect width="98" height="34" rx="6" fill="#08222A" stroke="#38BDF8" stroke-width="1" />
        <circle cx="16" cy="17" r="5" fill="#38BDF8" />
        <text x="28" y="16" font-family="sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">CYAN</text>
        <text x="28" y="26" font-family="ui-monospace, monospace" font-size="8" fill="#7DD3FC">#38BDF8</text>
      </g>

      <!-- Swatch 4: Alert Amber -->
      <g transform="translate(338, 24)">
        <rect width="98" height="34" rx="6" fill="#241B08" stroke="#F59E0B" stroke-width="1" />
        <circle cx="16" cy="17" r="5" fill="#F59E0B" />
        <text x="28" y="16" font-family="sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">AMBER</text>
        <text x="28" y="26" font-family="ui-monospace, monospace" font-size="8" fill="#FCD34D">#F59E0B</text>
      </g>
    </g>

    <!-- Philosophy Tagline -->
    <text x="0" y="250" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500" fill="#64748B">
      Architectural structure meets directional speed — engineered for mission-critical feedback networks.
    </text>
  </g>
</svg>
