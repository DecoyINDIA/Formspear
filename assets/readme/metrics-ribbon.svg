<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 100" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="ribbon-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#071310" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="metric-card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F241F" />
      <stop offset="100%" stop-color="#091714" />
    </linearGradient>

    <style>
      @keyframes metric-pulse {
        0%, 100% { filter: drop-shadow(0 0 4px rgba(16, 185, 129, 0.2)); }
        50% { filter: drop-shadow(0 0 10px rgba(52, 211, 153, 0.6)); }
      }
      .metric-box {
        animation: metric-pulse 5s ease-in-out infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .metric-box { animation: none !important; }
      }
    </style>
  </defs>

  <!-- Base Plate -->
  <rect width="1040" height="100" rx="12" fill="#060E0C" />
  <rect width="1040" height="100" rx="12" fill="url(#ribbon-glow)" />
  <rect width="1040" height="100" rx="12" stroke="#16382E" stroke-width="1.2" />

  <!-- 4 Metrics Columns -->
  <!-- Col 1: Throughput -->
  <g transform="translate(40, 20)" class="metric-box">
    <text x="0" y="14" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#94A3B8" letter-spacing="1">CONCURRENT INGESTION</text>
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="900" fill="#34D399">100 subs/s</text>
    <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#6EE7B7">Smoke verified load</text>
  </g>

  <line x1="260" y1="20" x2="260" y2="80" stroke="#16382E" stroke-width="1" />

  <!-- Col 2: Benchmarked Scale -->
  <g transform="translate(290, 20)">
    <text x="0" y="14" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#94A3B8" letter-spacing="1">DASHBOARD PAGINATION</text>
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF">100,000</text>
    <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#94A3B8">Responses in memory</text>
  </g>

  <line x1="510" y1="20" x2="510" y2="80" stroke="#16382E" stroke-width="1" />

  <!-- Col 3: Question Types -->
  <g transform="translate(540, 20)">
    <text x="0" y="14" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#94A3B8" letter-spacing="1">BUILDER VERSATILITY</text>
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="900" fill="#38BDF8">23 Types</text>
    <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#7DD3FC">Logic • Branching • QR</text>
  </g>

  <line x1="760" y1="20" x2="760" y2="80" stroke="#16382E" stroke-width="1" />

  <!-- Col 4: Engine Purity -->
  <g transform="translate(790, 20)">
    <text x="0" y="14" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#94A3B8" letter-spacing="1">RUNTIME ARCHITECTURE</text>
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="900" fill="#F59E0B">Node 20+</text>
    <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#FCD34D">Zero external web frameworks</text>
  </g>
</svg>