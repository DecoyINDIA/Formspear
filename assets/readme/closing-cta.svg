<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 390" width="100%" height="100%" fill="none">
  <defs>
    <!-- Ethereal Multi-Stop Aurora Gradients -->
    <radialGradient id="cta-aurora-core" cx="50%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.32" />
      <stop offset="35%" stop-color="#059669" stop-opacity="0.14" />
      <stop offset="65%" stop-color="#023024" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#020605" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cta-aurora-cyan" cx="25%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#020605" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cta-aurora-violet" cx="75%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#020605" stop-opacity="0" />
    </radialGradient>

    <!-- 3D Spearhead Facet Gradients -->
    <linearGradient id="cta-crest-facet-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D1FAE5" />
      <stop offset="30%" stop-color="#6EE7B7" />
      <stop offset="70%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="cta-crest-facet-r" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="45%" stop-color="#059669" />
      <stop offset="85%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>

    <!-- Glass Rim & Border Gradients -->
    <linearGradient id="cta-frame-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#124A3B" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0A2C22" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="cta-terminal-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="cta-pill-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08251D" />
      <stop offset="100%" stop-color="#041410" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="cta-crest-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="3" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="cta-stars-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="32" cy="32" r="0.6" fill="#134739" fill-opacity="0.5" />
    </pattern>

    <style>
      @keyframes cta-crest-breathe {
        0%, 100% { transform: translateY(0px) scale(1); filter: drop-shadow(0 0 14px rgba(16, 185, 129, 0.45)); }
        50% { transform: translateY(-4px) scale(1.05); filter: drop-shadow(0 0 28px rgba(52, 211, 153, 0.9)); }
      }
      @keyframes cta-ring-cw {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes cta-ring-ccw {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes cta-terminal-cursor {
        0%, 100% { opacity: 0; }
        50% { opacity: 1; }
      }
      @keyframes cta-pulse-beacon {
        0%, 100% { opacity: 0.3; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.2); }
      }
      @keyframes cta-shimmer-border {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; }
      }

      .cta-emblem-core {
        transform-origin: 550px 76px;
        animation: cta-crest-breathe 4.2s ease-in-out infinite;
      }
      .cta-gyro-cw {
        transform-origin: 550px 76px;
        animation: cta-ring-cw 18s linear infinite;
      }
      .cta-gyro-ccw {
        transform-origin: 550px 76px;
        animation: cta-ring-ccw 24s linear infinite;
      }
      .cta-cursor-blink {
        animation: cta-terminal-cursor 0.9s steps(2, start) infinite;
      }
      .cta-beacon {
        animation: cta-pulse-beacon 2s ease-in-out infinite;
      }
      .cta-terminal-box {
        animation: cta-shimmer-border 3.6s ease-in-out infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .cta-emblem-core, .cta-gyro-cw, .cta-gyro-ccw, .cta-cursor-blink, .cta-beacon, .cta-terminal-box {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Frame Background with Ethereal Emerald Aurora -->
  <rect width="1100" height="390" rx="16" fill="#020605" />
  <rect width="1100" height="390" rx="16" fill="url(#cta-stars-grid)" />
  <!-- Aurora plasma blobs -->
  <rect width="1100" height="390" rx="16" fill="url(#cta-aurora-core)" />
  <rect width="1100" height="390" rx="16" fill="url(#cta-aurora-cyan)" />
  <rect width="1100" height="390" rx="16" fill="url(#cta-aurora-violet)" />
  <rect width="1100" height="390" rx="16" stroke="url(#cta-frame-border)" stroke-width="1.5" />

  <!-- ==================== ORBITING CELESTIAL GYROSCOPE RINGS ==================== -->
  <g class="cta-gyro-cw">
    <ellipse cx="550" cy="76" rx="66" ry="66" stroke="#103F32" stroke-width="1.2" stroke-dasharray="3, 8" />
    <circle cx="550" cy="10" r="3.5" fill="#34D399" />
    <circle cx="550" cy="142" r="3.5" fill="#38BDF8" />
    <circle cx="484" cy="76" r="2.5" fill="#10B981" />
    <circle cx="616" cy="76" r="2.5" fill="#10B981" />
  </g>
  <g class="cta-gyro-ccw">
    <ellipse cx="550" cy="76" rx="90" ry="32" stroke="#165140" stroke-width="1" stroke-dasharray="6, 12" opacity="0.75" />
    <circle cx="460" cy="76" r="2.5" fill="#F59E0B" />
    <circle cx="640" cy="76" r="2.5" fill="#A78BFA" />
  </g>

  <!-- ==================== PULSATING 3D SPEARHEAD CREST ==================== -->
  <g class="cta-emblem-core" filter="url(#cta-crest-glow)">
    <!-- Base Outer Diamond Glow Shield -->
    <polygon points="550,40 578,76 550,110 522,76" fill="#031A13" stroke="#10B981" stroke-width="1.2" opacity="0.8" />
    <!-- 3D Spearhead Left Facet -->
    <polygon points="550,44 548,76 526,76" fill="url(#cta-crest-facet-l)" />
    <polygon points="550,104 548,76 526,76" fill="#047857" opacity="0.85" />
    <!-- 3D Spearhead Right Facet -->
    <polygon points="550,44 552,76 574,76" fill="url(#cta-crest-facet-r)" />
    <polygon points="550,104 552,76 574,76" fill="#024434" opacity="0.9" />
    <!-- Center Specular Spine -->
    <line x1="550" y1="42" x2="550" y2="106" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <!-- Core Optical Sensor -->
    <circle cx="550" cy="76" r="5" fill="#FFFFFF" />
    <circle cx="550" cy="76" r="2.5" fill="#10B981" />
  </g>

  <!-- ==================== TYPOGRAPHIC HEADLINE ==================== -->
  <g text-anchor="middle">
    <text x="550" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="0.5">
      Ready to Spearhead Your Feedback Intelligence?
    </text>
    <text x="550" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#CBD5E1">
      Deploy the complete, zero-framework feedback operating system in under 30 seconds.
    </text>
  </g>

  <!-- ==================== HIGH-END TERMINAL COMMAND COPY CONTAINER ==================== -->
  <g transform="translate(205, 204)">
    <!-- Liquid Glass Terminal Container -->
    <rect width="690" height="56" rx="10" fill="#010A07" stroke="url(#cta-terminal-border)" stroke-width="1.4" class="cta-terminal-box" />
    <rect x="0" y="0" width="690" height="1" fill="#34D399" fill-opacity="0.4" />
    
    <!-- Terminal Shell Prompt Icon -->
    <g transform="translate(18, 18)">
      <circle cx="6" cy="10" r="3.5" fill="#10B981" class="cta-beacon" />
    </g>

    <!-- Terminal Command String (Carefully Escaped) -->
    <text x="38" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="700" fill="#34D399">
      $ git clone https://github.com/DecoyINDIA/Formspear.git &amp;&amp; npm start
    </text>
    <text x="618" y="34" font-family="ui-monospace, monospace" font-size="13" fill="#34D399" class="cta-cursor-blink">_</text>

    <!-- Copy Action Pill Button -->
    <g transform="translate(584, 12)">
      <rect width="94" height="32" rx="6" fill="#0A3025" stroke="#1A6652" stroke-width="1" />
      <circle cx="16" cy="16" r="3.5" fill="#34D399" />
      <text x="28" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="800" fill="#ECFDF5" letter-spacing="0.5">CLONE</text>
    </g>
  </g>

  <!-- ==================== NAVIGATIONAL PILLS ==================== -->
  <g transform="translate(550, 302)" text-anchor="middle">
    <!-- Pill 1: REST API Docs -->
    <g transform="translate(-320, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="url(#cta-pill-glass)" stroke="#164A3B" stroke-width="1" />
      <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="700" fill="#6EE7B7">📖 REST API</text>
    </g>
    <!-- Pill 2: Architecture -->
    <g transform="translate(-160, 0)">
      <rect x="-70" y="-14" width="140" height="28" rx="14" fill="url(#cta-pill-glass)" stroke="#144C5E" stroke-width="1" />
      <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="700" fill="#7DD3FC">🏛️ Architecture</text>
    </g>
    <!-- Pill 3: Production Runbook -->
    <g transform="translate(0, 0)">
      <rect x="-80" y="-14" width="160" height="28" rx="14" fill="url(#cta-pill-glass)" stroke="#372F5E" stroke-width="1" />
      <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="700" fill="#C7D2FE">🚀 Production Cutover</text>
    </g>
    <!-- Pill 4: Zero-Trust Security -->
    <g transform="translate(160, 0)">
      <rect x="-70" y="-14" width="140" height="28" rx="14" fill="url(#cta-pill-glass)" stroke="#5B451A" stroke-width="1" />
      <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="700" fill="#FCD34D">🛡️ Zero-Trust</text>
    </g>
    <!-- Pill 5: Telemetry Flight Deck -->
    <g transform="translate(320, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="url(#cta-pill-glass)" stroke="#164A3B" stroke-width="1" />
      <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="700" fill="#6EE7B7">🌐 Flight Deck</text>
    </g>
  </g>

  <!-- ==================== DECOYINDIA LICENSE SEAL & FOOTER STRIPE ==================== -->
  <g transform="translate(550, 356)" text-anchor="middle">
    <!-- Subtle seal container pill -->
    <rect x="-420" y="-12" width="840" height="24" rx="12" fill="#03120E" stroke="#0E3328" stroke-width="0.8" />
    <circle cx="-380" cy="0" r="3" fill="#10B981" />
    <text x="0" y="4" font-family="ui-monospace, monospace" font-size="9.5" font-weight="600" fill="#94A3B8">
      FORMSPEAR FEEDBACKOS • ENGINEERED BY DecoyINDIA • ARCHITECT: SUBHAM JENA • ZERO EXTERNAL DEPENDENCIES • MIT LICENSE
    </text>
  </g>
</svg>