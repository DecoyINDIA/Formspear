<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="cta-glow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#059669" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#060E0C" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cta-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#1F4D41" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0D241F" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="cta-spear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <style>
      @keyframes cta-pulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 12px rgba(16, 185, 129, 0.4)); }
        50% { transform: scale(1.06); filter: drop-shadow(0 0 24px rgba(52, 211, 153, 0.8)); }
      }
      @keyframes glow-orbit {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes blink-cursor {
        0%, 100% { opacity: 0; }
        50% { opacity: 1; }
      }

      .cta-spear-mark {
        transform-origin: 550px 75px;
        animation: cta-pulse 4s ease-in-out infinite;
      }
      .orbit-ring {
        transform-origin: 550px 75px;
        animation: glow-orbit 12s linear infinite;
      }
      .cursor-blink {
        animation: blink-cursor 1s steps(2, start) infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .cta-spear-mark, .orbit-ring, .cursor-blink {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Frame Background -->
  <rect width="1100" height="360" rx="16" fill="#070E0C" />
  <rect width="1100" height="360" rx="16" fill="url(#cta-glow)" />
  <rect width="1100" height="360" rx="16" stroke="url(#cta-border)" stroke-width="1.5" />

  <!-- Orbit Telemetry Rings -->
  <g class="orbit-ring">
    <circle cx="550" cy="75" r="48" stroke="#164336" stroke-width="1" stroke-dasharray="3, 6" />
    <circle cx="550" cy="27" r="3" fill="#34D399" />
    <circle cx="550" cy="123" r="2.5" fill="#38BDF8" />
  </g>

  <!-- Spearhead Symbol at Center Top -->
  <g class="cta-spear-mark">
    <polygon points="550,45 572,75 550,98 528,75" fill="#0C201A" stroke="url(#cta-spear)" stroke-width="2" />
    <polygon points="550,52 566,75 550,90 540,75" fill="url(#cta-spear)" />
    <circle cx="550" cy="75" r="3" fill="#FFFFFF" />
  </g>

  <!-- Headings & Typography -->
  <g text-anchor="middle">
    <text x="550" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">
      Ready to Transform Raw Feedback into Operational Intelligence?
    </text>
    <text x="550" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#94A3B8">
      Clone, run, and explore the complete full-stack feedback OS in under 30 seconds.
    </text>
  </g>

  <!-- Interactive-Looking Terminal Box -->
  <g transform="translate(230, 200)">
    <rect width="640" height="48" rx="8" fill="#040B09" stroke="#1A4739" stroke-width="1.2" />
    <circle cx="20" cy="24" r="5" fill="#EF4444" />
    <circle cx="36" cy="24" r="5" fill="#F59E0B" />
    <circle cx="52" cy="24" r="5" fill="#10B981" />

    <text x="76" y="29" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#E2E8F0">
      git clone https://github.com/DecoyINDIA/Formspear.git &amp;&amp; cd Formspear &amp;&amp; npm install &amp;&amp; npm start
    </text>
    <text x="618" y="29" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#34D399" class="cursor-blink">_</text>
  </g>

  <!-- Action Badges Cluster -->
  <g transform="translate(550, 290)" text-anchor="middle">
    <!-- Primary CTA: Quickstart -->
    <g transform="translate(-170, 0)">
      <rect x="-85" y="-16" width="170" height="34" rx="17" fill="#10B981" />
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#042F24">QUICKSTART GUIDE →</text>
    </g>

    <!-- Secondary CTA: API Docs -->
    <g transform="translate(0, 0)">
      <rect x="-75" y="-16" width="150" height="34" rx="17" fill="#0D201A" stroke="#1F4D3F" stroke-width="1.2" />
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#E2E8F0">API REFERENCE</text>
    </g>

    <!-- Tertiary CTA: Architecture -->
    <g transform="translate(170, 0)">
      <rect x="-85" y="-16" width="170" height="34" rx="17" fill="#0D201A" stroke="#1F4D3F" stroke-width="1.2" />
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#E2E8F0">ARCHITECTURE SPEC</text>
    </g>
  </g>
</svg>