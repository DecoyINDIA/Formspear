<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="fs-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0E2D24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#040907" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="quad-panel-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081E18" />
      <stop offset="100%" stop-color="#05120E" />
    </linearGradient>
    <linearGradient id="laser-scan-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0" />
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="branch-stream-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <style>
      /* Quadrant 1: Logic Tree */
      @keyframes logic-packet-flow {
        0% { stroke-dashoffset: 140; opacity: 0.2; }
        40% { stroke-dashoffset: 0; opacity: 1; }
        80%, 100% { stroke-dashoffset: -140; opacity: 0.2; }
      }
      @keyframes logic-node-flash {
        0%, 35% { fill: #081B15; stroke: #194F40; }
        45%, 85% { fill: #064E3B; stroke: #34D399; }
        95%, 100% { fill: #081B15; stroke: #194F40; }
      }

      /* Quadrant 2: Geospatial Hubs */
      @keyframes geo-radar-sweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes geo-blip-pulse {
        0%, 100% { transform: scale(1); opacity: 0.4; }
        50% { transform: scale(1.6); opacity: 1; }
      }
      @keyframes bar-grow {
        0%, 100% { transform: scaleX(0.92); }
        50% { transform: scaleX(1.04); }
      }

      /* Quadrant 3: Quarantine Laser */
      @keyframes laser-vertical-sweep {
        0%, 100% { transform: translateY(0px); opacity: 0.3; }
        50% { transform: translateY(74px); opacity: 0.95; }
      }
      @keyframes shield-stamp-pop {
        0%, 40% { opacity: 0; transform: scale(0.85); }
        55%, 85% { opacity: 1; transform: scale(1); }
        95%, 100% { opacity: 0; }
      }

      /* Quadrant 4: Dispatch Packets */
      @keyframes packet-burst-flow {
        0% { transform: translateX(0px); opacity: 0; }
        25% { opacity: 1; }
        80% { transform: translateX(110px); opacity: 1; }
        100% { transform: translateX(110px); opacity: 0; }
      }

      .logic-path {
        stroke-dasharray: 8, 8;
        animation: logic-packet-flow 3.5s linear infinite;
      }
      .node-pulse {
        animation: logic-node-flash 3.5s ease-in-out infinite;
      }
      .geo-radar {
        transform-origin: 660px 170px;
        animation: geo-radar-sweep 8s linear infinite;
      }
      .geo-blip {
        animation: geo-blip-pulse 2.2s ease-in-out infinite;
      }
      .bar-anim {
        transform-origin: left;
        animation: bar-grow 4s ease-in-out infinite;
      }
      .laser-scan {
        animation: laser-vertical-sweep 3.2s ease-in-out infinite;
      }
      .shield-stamp {
        transform-origin: 280px 420px;
        animation: shield-stamp-pop 4s ease-in-out infinite;
      }
      .packet-burst {
        animation: packet-burst-flow 2.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .logic-path, .node-pulse, .geo-radar, .geo-blip, .bar-anim, .laser-scan, .shield-stamp, .packet-burst {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Frame Background -->
  <rect width="1100" height="560" rx="16" fill="#040907" />
  <rect width="1100" height="560" rx="16" fill="url(#fs-glow)" />
  <rect width="1100" height="560" rx="16" stroke="#16382E" stroke-width="1.2" />

  <!-- Instrument Header Bar -->
  <g transform="translate(36, 26)">
    <circle cx="6" cy="6" r="4.5" fill="#10B981" />
    <text x="20" y="10" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#34D399" letter-spacing="1.2">CORE OPERATIONAL ENGINES</text>
    <text x="240" y="10" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500" fill="#64748B">Four purpose-built architectural subsystems driving real-time enterprise telemetry</text>
  </g>

  <!-- ==================== QUADRANT 1: DYNAMIC SKIP-LOGIC ENGINE ==================== -->
  <g transform="translate(36, 56)">
    <rect width="500" height="235" rx="10" fill="url(#quad-panel-grad)" stroke="#19473B" stroke-width="1.2" />
    
    <!-- Title Strip -->
    <g transform="translate(20, 20)">
      <circle cx="6" cy="6" r="4" fill="#34D399" />
      <text x="18" y="10" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">1. Dynamic Skip-Logic &amp; Rule Graph</text>
      <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#94A3B8">Cycle-free DAG routing with forward skips and 23 question types</text>
    </g>

    <!-- Visualized Decision Flow Tree -->
    <g transform="translate(20, 68)">
      <!-- Root Question Node -->
      <g transform="translate(0, 36)">
        <rect width="124" height="42" rx="6" fill="#09201A" stroke="#1D5C4B" stroke-width="1" />
        <text x="12" y="18" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#34D399">RULE_TRIGGER</text>
        <text x="12" y="32" font-family="sans-serif" font-size="9.5" fill="#E2E8F0">CSAT Score (1-5)</text>
      </g>

      <!-- Connecting Paths -->
      <path d="M 124 46 Q 160 46 185 24" fill="none" stroke="#EF4444" stroke-width="1.5" class="logic-path" />
      <path d="M 124 68 Q 160 68 185 90" fill="none" stroke="#10B981" stroke-width="1.5" class="logic-path" />

      <!-- Branch A: Detractor Flow (Score <= 2) -->
      <g transform="translate(188, 6)">
        <rect width="180" height="38" rx="6" fill="#1C1010" stroke="#7F1D1D" stroke-width="1" />
        <circle cx="14" cy="19" r="4" fill="#EF4444" />
        <text x="24" y="16" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#FCA5A5">CSAT &lt;= 2: Incident Route</text>
        <text x="24" y="29" font-family="sans-serif" font-size="8.5" fill="#94A3B8">Jump to Manager Recovery Form</text>
      </g>

      <!-- Branch B: Promoter Flow (Score >= 4) -->
      <g transform="translate(188, 72)" class="node-pulse">
        <rect width="180" height="38" rx="6" fill="#09251D" stroke="#34D399" stroke-width="1.2" />
        <circle cx="14" cy="19" r="4" fill="#10B981" />
        <text x="24" y="16" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#86EFAC">CSAT &gt;= 4: Review Booster</text>
        <text x="24" y="29" font-family="sans-serif" font-size="8.5" fill="#94A3B8">Show Google Referral Screen</text>
      </g>

      <!-- Verification Badge -->
      <g transform="translate(0, 108)">
        <rect width="180" height="22" rx="11" fill="#072019" stroke="#134739" stroke-width="0.8" />
        <text x="90" y="15" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" font-weight="600" fill="#34D399">✓ CYCLE-FREE GRAPH VALIDATED</text>
      </g>
    </g>
  </g>

  <!-- ==================== QUADRANT 2: MULTI-BRANCH GEOSPATIAL INTELLIGENCE ==================== -->
  <g transform="translate(564, 56)">
    <rect width="500" height="235" rx="10" fill="url(#quad-panel-grad)" stroke="#19473B" stroke-width="1.2" />

    <!-- Title Strip -->
    <g transform="translate(20, 20)">
      <circle cx="6" cy="6" r="4" fill="#38BDF8" />
      <text x="18" y="10" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">2. Multi-Branch Geospatial Telemetry</text>
      <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#94A3B8">Real-time attribution, cross-location leaderboards &amp; funnel drop analytics</text>
    </g>

    <!-- Hub Mesh & Radar Area -->
    <g transform="translate(20, 68)">
      <!-- Radar Sweep Circle (Left) -->
      <g transform="translate(60, 55)">
        <circle cx="0" cy="0" r="48" fill="#061A14" stroke="#123B2F" stroke-width="1" />
        <circle cx="0" cy="0" r="30" stroke="#1A4A3C" stroke-dasharray="2, 4" stroke-width="1" />
        <!-- Rotating Beam -->
        <g class="geo-radar">
          <line x1="0" y1="0" x2="48" y2="0" stroke="#38BDF8" stroke-width="1.5" />
          <polygon points="0,0 48,-15 48,0" fill="#38BDF8" opacity="0.25" />
        </g>
        <!-- Blips -->
        <circle cx="18" cy="-14" r="3.5" fill="#34D399" class="geo-blip" />
        <circle cx="-22" cy="18" r="3" fill="#38BDF8" class="geo-blip" />
        <circle cx="12" cy="24" r="3" fill="#F59E0B" class="geo-blip" />
        <text x="0" y="4" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#ECFDF5">14 HUBS</text>
      </g>

      <!-- Comparative Branch Bars (Right) -->
      <g transform="translate(150, 8)">
        <!-- Branch 1: BLR -->
        <text x="0" y="12" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#34D399">BLR Flagship</text>
        <rect x="85" y="4" width="160" height="12" rx="3" fill="#08201A" />
        <rect x="85" y="4" width="145" height="12" rx="3" fill="#10B981" class="bar-anim" />
        <text x="255" y="13.5" font-family="sans-serif" font-size="9" font-weight="700" fill="#ECFDF5">+82 NPS</text>

        <!-- Branch 2: BOM -->
        <text x="0" y="38" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#38BDF8">BOM South</text>
        <rect x="85" y="30" width="160" height="12" rx="3" fill="#08201A" />
        <rect x="85" y="30" width="128" height="12" rx="3" fill="#38BDF8" class="bar-anim" />
        <text x="255" y="39.5" font-family="sans-serif" font-size="9" font-weight="700" fill="#ECFDF5">+74 NPS</text>

        <!-- Branch 3: HYD -->
        <text x="0" y="64" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#A78BFA">HYD Tech Hub</text>
        <rect x="85" y="56" width="160" height="12" rx="3" fill="#08201A" />
        <rect x="85" y="56" width="138" height="12" rx="3" fill="#818CF8" class="bar-anim" />
        <text x="255" y="65.5" font-family="sans-serif" font-size="9" font-weight="700" fill="#ECFDF5">+79 NPS</text>

        <!-- Branch 4: DEL -->
        <text x="0" y="90" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#F59E0B">DEL Central</text>
        <rect x="85" y="82" width="160" height="12" rx="3" fill="#08201A" />
        <rect x="85" y="82" width="115" height="12" rx="3" fill="#F59E0B" class="bar-anim" />
        <text x="255" y="91.5" font-family="sans-serif" font-size="9" font-weight="700" fill="#ECFDF5">+68 NPS</text>
      </g>
    </g>
  </g>

  <!-- ==================== QUADRANT 3: ZERO-TRUST FILE QUARANTINE PIPELINE ==================== -->
  <g transform="translate(36, 305)">
    <rect width="500" height="235" rx="10" fill="url(#quad-panel-grad)" stroke="#19473B" stroke-width="1.2" />

    <!-- Title Strip -->
    <g transform="translate(20, 20)">
      <circle cx="6" cy="6" r="4" fill="#F59E0B" />
      <text x="18" y="10" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">3. Zero-Trust File Quarantine Pipeline</text>
      <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#94A3B8">In-memory buffer quarantine with EICAR heuristics &amp; SigV4 object storage</text>
    </g>

    <!-- Visualized File Scanner -->
    <g transform="translate(20, 68)">
      <!-- File Hologram Box -->
      <g transform="translate(10, 10)">
        <rect width="180" height="105" rx="8" fill="#081E18" stroke="#1B5544" stroke-width="1" />
        <rect x="14" y="14" width="28" height="34" rx="4" fill="#0E352B" stroke="#34D399" stroke-width="1" />
        <text x="28" y="35" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#34D399">PDF</text>
        
        <text x="50" y="26" font-family="sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">audit_receipt.pdf</text>
        <text x="50" y="40" font-family="ui-monospace, monospace" font-size="8.5" fill="#64748B">342 KB • application/pdf</text>

        <!-- Laser Scanning Beam -->
        <g class="laser-scan">
          <line x1="10" y1="18" x2="170" y2="18" stroke="#34D399" stroke-width="2" />
          <rect x="10" y="8" width="160" height="10" fill="url(#laser-scan-grad)" />
        </g>

        <!-- Dynamic Stamp Pop -->
        <g class="shield-stamp" transform="translate(90, 75)">
          <rect x="-60" y="-12" width="120" height="24" rx="12" fill="#064E3B" stroke="#34D399" stroke-width="1.2" />
          <text x="0" y="4" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" font-weight="800" fill="#ECFDF5">✓ VERIFIED CLEAN</text>
        </g>
      </g>

      <!-- Multi-Stage Check Tiers (Right) -->
      <g transform="translate(215, 14)">
        <g transform="translate(0, 0)">
          <circle cx="6" cy="6" r="4" fill="#34D399" />
          <text x="18" y="10" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#FFFFFF">MIME Header Validation</text>
          <text x="18" y="22" font-family="sans-serif" font-size="8.5" fill="#94A3B8">Deep magic byte verification</text>
        </g>
        <g transform="translate(0, 32)">
          <circle cx="6" cy="6" r="4" fill="#34D399" />
          <text x="18" y="10" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#FFFFFF">EICAR Heuristic Signature</text>
          <text x="18" y="22" font-family="sans-serif" font-size="8.5" fill="#94A3B8">Blocks embedded virus payloads</text>
        </g>
        <g transform="translate(0, 64)">
          <circle cx="6" cy="6" r="4" fill="#38BDF8" />
          <text x="18" y="10" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#FFFFFF">AWS SigV4 Presigner</text>
          <text x="18" y="22" font-family="sans-serif" font-size="8.5" fill="#94A3B8">Zero-credential leakage direct upload</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ==================== QUADRANT 4: MULTI-CHANNEL DISPATCH HUB ==================== -->
  <g transform="translate(564, 305)">
    <rect width="500" height="235" rx="10" fill="url(#quad-panel-grad)" stroke="#19473B" stroke-width="1.2" />

    <!-- Title Strip -->
    <g transform="translate(20, 20)">
      <circle cx="6" cy="6" r="4" fill="#A78BFA" />
      <text x="18" y="10" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">4. Sub-12ms Alert &amp; Webhook Hub</text>
      <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#94A3B8">Autonomous multi-destination dispatch with cryptographic HMAC signing</text>
    </g>

    <!-- Dispatch Architecture Visual -->
    <g transform="translate(20, 68)">
      <!-- Central Event Bus Node -->
      <g transform="translate(10, 35)">
        <rect width="105" height="50" rx="8" fill="#0C241D" stroke="#34D399" stroke-width="1.5" />
        <circle cx="16" cy="25" r="4.5" fill="#10B981" />
        <text x="26" y="21" font-family="ui-monospace, monospace" font-size="9" font-weight="800" fill="#34D399">EVENT_BUS</text>
        <text x="26" y="34" font-family="sans-serif" font-size="8.5" fill="#E2E8F0">FeedbackOS</text>
      </g>

      <!-- Connecting Conduits with Animated Packets -->
      <g transform="translate(115, 60)">
        <line x1="0" y1="0" x2="110" y2="-32" stroke="#195443" stroke-width="1.5" />
        <line x1="0" y1="0" x2="110" y2="-10" stroke="#195443" stroke-width="1.5" />
        <line x1="0" y1="0" x2="110" y2="12" stroke="#195443" stroke-width="1.5" />
        <line x1="0" y1="0" x2="110" y2="34" stroke="#195443" stroke-width="1.5" />

        <!-- Animated Data Packets -->
        <g class="packet-burst">
          <circle cx="0" cy="0" r="3.5" fill="#34D399" />
          <circle cx="0" cy="-20" r="3" fill="#38BDF8" />
          <circle cx="0" cy="20" r="3" fill="#A78BFA" />
        </g>
      </g>

      <!-- Destination Targets (Right) -->
      <g transform="translate(245, 6)">
        <!-- WhatsApp -->
        <g transform="translate(0, 0)">
          <rect width="215" height="24" rx="4" fill="#082018" stroke="#165B47" stroke-width="0.8" />
          <text x="12" y="16" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#34D399">WhatsApp Business</text>
          <text x="145" y="16" font-family="ui-monospace, monospace" font-size="8.5" fill="#6EE7B7">8.4ms [DELIV]</text>
        </g>
        <!-- Slack -->
        <g transform="translate(0, 28)">
          <rect width="215" height="24" rx="4" fill="#082018" stroke="#165B47" stroke-width="0.8" />
          <text x="12" y="16" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#38BDF8">Slack #vip-alerts</text>
          <text x="145" y="16" font-family="ui-monospace, monospace" font-size="8.5" fill="#7DD3FC">11.1ms [SENT]</text>
        </g>
        <!-- Teams -->
        <g transform="translate(0, 56)">
          <rect width="215" height="24" rx="4" fill="#082018" stroke="#165B47" stroke-width="0.8" />
          <text x="12" y="16" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#A78BFA">Microsoft Teams</text>
          <text x="145" y="16" font-family="ui-monospace, monospace" font-size="8.5" fill="#C7D2FE">10.3ms [SENT]</text>
        </g>
        <!-- Signed Webhook -->
        <g transform="translate(0, 84)">
          <rect width="215" height="24" rx="4" fill="#082018" stroke="#165B47" stroke-width="0.8" />
          <text x="12" y="16" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#F59E0B">HMAC Webhook</text>
          <text x="145" y="16" font-family="ui-monospace, monospace" font-size="8.5" fill="#FCD34D">200 OK [SHA256]</text>
        </g>
      </g>
    </g>
  </g>
</svg>
