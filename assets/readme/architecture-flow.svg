<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="arch-glow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#059669" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#060E0C" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="layer-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#122A23" />
      <stop offset="100%" stop-color="#0A1815" />
    </linearGradient>

    <style>
      @keyframes signal-flow-down {
        0% { stroke-dashoffset: 60; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes packet-travel-v {
        0% { transform: translateY(0px); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translateY(68px); opacity: 0; }
      }
      @keyframes ram-pg-pulse {
        0%, 100% { stroke: #34D399; opacity: 0.4; }
        50% { stroke: #10B981; opacity: 1; }
      }
      @keyframes core-glow-pulse {
        0%, 100% { filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.3)); }
        50% { filter: drop-shadow(0 0 20px rgba(52, 211, 153, 0.7)); }
      }

      .flow-stream {
        stroke-dasharray: 6, 6;
        animation: signal-flow-down 2s linear infinite;
      }
      .packet-dot {
        animation: packet-travel-v 2.5s linear infinite;
      }
      .ram-pg-line {
        animation: ram-pg-pulse 3s ease-in-out infinite;
      }
      .server-core {
        animation: core-glow-pulse 4s ease-in-out infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .flow-stream, .packet-dot, .ram-pg-line, .server-core {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Canvas Floor -->
  <rect width="1040" height="520" rx="16" fill="#070E0C" />
  <rect width="1040" height="520" rx="16" fill="url(#arch-glow)" />
  <rect width="1040" height="520" rx="16" stroke="#16382E" stroke-width="1.2" />

  <!-- Architecture Header Banner -->
  <g transform="translate(40, 28)">
    <circle cx="6" cy="6" r="5" fill="#10B981" />
    <text x="24" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#34D399" letter-spacing="1.2">SYSTEM TOPOLOGY &amp; DATA ENGINE</text>
    <text x="260" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748B">Zero-framework Node.js 20 architecture with atomic in-memory speed &amp; PostgreSQL persistence</text>
  </g>

  <!-- ==================== TIER 1: CLIENT & INGESTION LAYER (Y: 60) ==================== -->
  <g transform="translate(40, 60)">
    <rect width="960" height="70" rx="10" fill="url(#layer-grad)" stroke="#1F473B" stroke-width="1.2" />
    <text x="24" y="24" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#34D399" letter-spacing="1">TIER 1 • INGESTION EDGE</text>

    <!-- Node 1: Public Web & Mobile -->
    <g transform="translate(24, 32)">
      <rect width="210" height="28" rx="5" fill="#0A1C17" stroke="#1F5646" stroke-width="1" />
      <circle cx="14" cy="14" r="3.5" fill="#34D399" />
      <text x="28" y="18" font-family="sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Public Survey PWA (/s/:slug)</text>
    </g>

    <!-- Node 2: Embed Script -->
    <g transform="translate(260, 32)">
      <rect width="210" height="28" rx="5" fill="#0A1C17" stroke="#1F5646" stroke-width="1" />
      <circle cx="14" cy="14" r="3.5" fill="#38BDF8" />
      <text x="28" y="18" font-family="sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Website Embed (/embed.js)</text>
    </g>

    <!-- Node 3: In-App SDK -->
    <g transform="translate(496, 32)">
      <rect width="210" height="28" rx="5" fill="#0A1C17" stroke="#1F5646" stroke-width="1" />
      <circle cx="14" cy="14" r="3.5" fill="#A78BFA" />
      <text x="28" y="18" font-family="sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">In-App Feedback SDK (/sdk.js)</text>
    </g>

    <!-- Node 4: Dynamic QR Vectors -->
    <g transform="translate(732, 32)">
      <rect width="204" height="28" rx="5" fill="#0A1C17" stroke="#1F5646" stroke-width="1" />
      <circle cx="14" cy="14" r="3.5" fill="#F59E0B" />
      <text x="28" y="18" font-family="sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Branded QR Scans (Physical)</text>
    </g>
  </g>

  <!-- Vertical Connectors Tier 1 -> Tier 2 -->
  <g transform="translate(0, 130)">
    <line x1="165" y1="0" x2="165" y2="40" stroke="#1F5646" stroke-width="2" class="flow-stream" />
    <circle cx="165" cy="0" r="3" fill="#34D399" class="packet-dot" />
    <line x1="400" y1="0" x2="400" y2="40" stroke="#1F5646" stroke-width="2" class="flow-stream" />
    <circle cx="400" cy="0" r="3" fill="#38BDF8" class="packet-dot" />
    <line x1="640" y1="0" x2="640" y2="40" stroke="#1F5646" stroke-width="2" class="flow-stream" />
    <circle cx="640" cy="0" r="3" fill="#A78BFA" class="packet-dot" />
    <line x1="875" y1="0" x2="875" y2="40" stroke="#1F5646" stroke-width="2" class="flow-stream" />
    <circle cx="875" cy="0" r="3" fill="#F59E0B" class="packet-dot" />
  </g>

  <!-- ==================== TIER 2: NODE.JS ZERO-FRAMEWORK GATEWAY (Y: 170) ==================== -->
  <g transform="translate(40, 170)">
    <rect width="960" height="100" rx="10" fill="url(#layer-grad)" stroke="#235E4E" stroke-width="1.5" class="server-core" />
    <text x="24" y="24" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#6EE7B7" letter-spacing="1">TIER 2 • ZERO-FRAMEWORK HTTP COMPOSITION ROOT (src/server.js)</text>
    <text x="750" y="24" font-family="ui-monospace, monospace" font-size="10" fill="#94A3B8">node:http • Single Writer Process</text>

    <!-- Sub-Modules Grid -->
    <g transform="translate(24, 38)">
      <!-- Security Boundary -->
      <g>
        <rect width="210" height="48" rx="6" fill="#0C201B" stroke="#1D4A3C" stroke-width="1" />
        <text x="14" y="20" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#34D399">Security Boundary</text>
        <text x="14" y="36" font-family="ui-monospace, monospace" font-size="9" fill="#94A3B8">Hashed Keys • CSRF • SSRF Shield</text>
      </g>

      <!-- Extracted Context Routes -->
      <g transform="translate(236, 0)">
        <rect width="320" height="48" rx="6" fill="#0C201B" stroke="#1D4A3C" stroke-width="1" />
        <text x="14" y="20" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#38BDF8">Context-Injected Route Controllers</text>
        <text x="14" y="36" font-family="ui-monospace, monospace" font-size="9" fill="#94A3B8">responses.js • analytics.js • ai-summary.js • billing.js</text>
      </g>

      <!-- In-Process Job Dispatcher -->
      <g transform="translate(582, 0)">
        <rect width="330" height="48" rx="6" fill="#0C201B" stroke="#1D4A3C" stroke-width="1" />
        <text x="14" y="20" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#F59E0B">Job Engine &amp; 5s Recurring Scheduler</text>
        <text x="14" y="36" font-family="ui-monospace, monospace" font-size="9" fill="#94A3B8">processDueJobs() • Retryable Queue • BullMQ mode</text>
      </g>
    </g>
  </g>

  <!-- Connectors Tier 2 -> Tier 3 -->
  <g transform="translate(0, 270)">
    <line x1="260" y1="0" x2="260" y2="40" stroke="#10B981" stroke-width="2" class="flow-stream" />
    <circle cx="260" cy="0" r="3" fill="#34D399" class="packet-dot" />
    <line x1="780" y1="0" x2="780" y2="40" stroke="#F59E0B" stroke-width="2" class="flow-stream" />
    <circle cx="780" cy="0" r="3" fill="#F59E0B" class="packet-dot" />
  </g>

  <!-- ==================== TIER 3: STATE & DUAL-STORE PERSISTENCE (Y: 310) ==================== -->
  <g transform="translate(40, 310)">
    <rect width="960" height="85" rx="10" fill="url(#layer-grad)" stroke="#1F473B" stroke-width="1.2" />
    <text x="24" y="22" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#34D399" letter-spacing="1">TIER 3 • STATE &amp; DUAL-STORE ENGINE</text>

    <g transform="translate(24, 32)">
      <!-- Synchronous RAM Store -->
      <g>
        <rect width="280" height="42" rx="6" fill="#0A1F18" stroke="#34D399" stroke-width="1.2" />
        <circle cx="16" cy="21" r="5" fill="#10B981" />
        <text x="32" y="18" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">In-Memory State (&lt;1ms reads)</text>
        <text x="32" y="32" font-family="ui-monospace, monospace" font-size="9" fill="#6EE7B7">36 Collections • Synchronous mutation</text>
      </g>

      <!-- Batching Engine Link -->
      <g transform="translate(290, 0)">
        <line x1="0" y1="21" x2="50" y2="21" stroke="#34D399" stroke-width="2" class="ram-pg-line" stroke-dasharray="3, 3" />
        <text x="25" y="12" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8.5" fill="#94A3B8">5ms diff</text>
      </g>

      <!-- PostgreSQL Relational Persistence -->
      <g transform="translate(350, 0)">
        <rect width="280" height="42" rx="6" fill="#0A1C22" stroke="#38BDF8" stroke-width="1.2" />
        <circle cx="16" cy="21" r="5" fill="#38BDF8" />
        <text x="32" y="18" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">PostgreSQL Relational Tables</text>
        <text x="32" y="32" font-family="ui-monospace, monospace" font-size="9" fill="#7DD3FC">pg-shadow row diff • Advisory Lock</text>
      </g>

      <!-- Local JSON Fallback / Backup -->
      <g transform="translate(640, 0)">
        <rect width="270" height="42" rx="6" fill="#171A14" stroke="#84CC16" stroke-width="1" />
        <circle cx="16" cy="21" r="4.5" fill="#84CC16" />
        <text x="30" y="18" font-family="sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Atomic JSON Dev Mode</text>
        <text x="30" y="32" font-family="ui-monospace, monospace" font-size="9" fill="#BEF264">Manifest-backed checksum backups</text>
      </g>
    </g>
  </g>

  <!-- ==================== TIER 4: EXTERNAL PROVIDERS & DISPATCH (Y: 415) ==================== -->
  <g transform="translate(40, 415)">
    <rect width="960" height="85" rx="10" fill="#091411" stroke="#16382E" stroke-width="1" />
    <text x="24" y="22" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#64748B" letter-spacing="1">TIER 4 • EXTERNAL SERVICES &amp; INTEGRATIONS</text>

    <g transform="translate(24, 34)">
      <!-- AI Provider -->
      <rect x="0" y="0" width="168" height="36" rx="5" fill="#0E1A22" stroke="#1D4359" stroke-width="1" />
      <text x="12" y="16" font-family="sans-serif" font-size="10" font-weight="700" fill="#38BDF8">🤖 OpenAI LLM API</text>
      <text x="12" y="28" font-family="ui-monospace, monospace" font-size="8.5" fill="#94A3B8">Themes, NPS &amp; PDF</text>

      <!-- Storage S3/R2 -->
      <rect x="186" y="0" width="168" height="36" rx="5" fill="#1A180E" stroke="#5C4813" stroke-width="1" />
      <text x="12" y="16" font-family="sans-serif" font-size="10" font-weight="700" fill="#FBBF24">🗄️ AWS S3 / Cloudflare R2</text>
      <text x="12" y="28" font-family="ui-monospace, monospace" font-size="8.5" fill="#94A3B8">SigV4 Quarantine Files</text>

      <!-- Notifications & WhatsApp -->
      <rect x="372" y="0" width="180" height="36" rx="5" fill="#0D201A" stroke="#184D3C" stroke-width="1" />
      <text x="12" y="16" font-family="sans-serif" font-size="10" font-weight="700" fill="#34D399">💬 WhatsApp &amp; SMTP Email</text>
      <text x="12" y="28" font-family="ui-monospace, monospace" font-size="8.5" fill="#94A3B8">Branch alerts &amp; invites</text>

      <!-- Billing Gateways -->
      <rect x="570" y="0" width="170" height="36" rx="5" fill="#1C1424" stroke="#5B21B6" stroke-width="1" />
      <text x="12" y="16" font-family="sans-serif" font-size="10" font-weight="700" fill="#C084FC">💳 Razorpay &amp; Stripe</text>
      <text x="12" y="28" font-family="ui-monospace, monospace" font-size="8.5" fill="#94A3B8">GST Invoices, Portals</text>

      <!-- Observability -->
      <rect x="758" y="0" width="154" height="36" rx="5" fill="#1A1215" stroke="#701A28" stroke-width="1" />
      <text x="12" y="16" font-family="sans-serif" font-size="10" font-weight="700" fill="#F43F5E">📊 Sentry &amp; PostHog</text>
      <text x="12" y="28" font-family="ui-monospace, monospace" font-size="8.5" fill="#94A3B8">Readiness audits</text>
    </g>
  </g>
</svg>