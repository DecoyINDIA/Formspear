<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="arch-deep-glow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0F2B23" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#040907" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="tier-panel-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091E19" />
      <stop offset="100%" stop-color="#05120E" />
    </linearGradient>
    <linearGradient id="pg-sync-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <style>
      @keyframes conduit-stream {
        0% { stroke-dashoffset: 80; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes packet-step-down {
        0% { transform: translateY(0px); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translateY(72px); opacity: 0; }
      }
      @keyframes lock-beacon-pulse {
        0%, 100% { fill: #064E3B; stroke: #34D399; }
        50% { fill: #047857; stroke: #6EE7B7; }
      }
      @keyframes memory-core-glow {
        0%, 100% { filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.35)); }
        50% { filter: drop-shadow(0 0 20px rgba(52, 211, 153, 0.75)); }
      }

      .conduit-flow {
        stroke-dasharray: 6, 6;
        animation: conduit-stream 2.2s linear infinite;
      }
      .packet-flow {
        animation: packet-step-down 2.4s linear infinite;
      }
      .lock-beacon {
        animation: lock-beacon-pulse 3s ease-in-out infinite;
      }
      .memory-core {
        animation: memory-core-glow 3.8s ease-in-out infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .conduit-flow, .packet-flow, .lock-beacon, .memory-core {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Frame Background -->
  <rect width="1100" height="580" rx="16" fill="#040907" />
  <rect width="1100" height="580" rx="16" fill="url(#arch-deep-glow)" />
  <rect width="1100" height="580" rx="16" stroke="#16382E" stroke-width="1.2" />

  <!-- Instrument Header Bar -->
  <g transform="translate(36, 26)">
    <circle cx="6" cy="6" r="4.5" fill="#10B981" />
    <text x="20" y="10" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#34D399" letter-spacing="1.2">SYSTEM ARCHITECTURE &amp; DATA ENGINE</text>
    <text x="270" y="10" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500" fill="#64748B">Zero-framework Node.js 20 architecture with atomic in-memory speed &amp; PostgreSQL persistence</text>
  </g>

  <!-- ==================== TIER 1: INGESTION EDGE (Y: 56, H: 64) ==================== -->
  <g transform="translate(36, 56)">
    <rect width="1028" height="64" rx="8" fill="url(#tier-panel-grad)" stroke="#19473B" stroke-width="1.2" />
    <text x="20" y="20" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#34D399">TIER 1 • INGESTION EDGE</text>

    <!-- Edge Nodes -->
    <g transform="translate(20, 28)">
      <!-- Node 1: PWA -->
      <g transform="translate(0, 0)">
        <rect width="215" height="26" rx="4" fill="#08201A" stroke="#1E5C4A" stroke-width="0.8" />
        <circle cx="12" cy="13" r="3" fill="#34D399" />
        <text x="24" y="17" font-family="sans-serif" font-size="10" font-weight="600" fill="#ECFDF5">Public Survey PWA (/s/:slug)</text>
      </g>
      <!-- Node 2: Embed Script -->
      <g transform="translate(230, 0)">
        <rect width="215" height="26" rx="4" fill="#08201A" stroke="#1E5C4A" stroke-width="0.8" />
        <circle cx="12" cy="13" r="3" fill="#38BDF8" />
        <text x="24" y="17" font-family="sans-serif" font-size="10" font-weight="600" fill="#ECFDF5">Website Embed (/embed.js)</text>
      </g>
      <!-- Node 3: In-App SDK -->
      <g transform="translate(460, 0)">
        <rect width="215" height="26" rx="4" fill="#08201A" stroke="#1E5C4A" stroke-width="0.8" />
        <circle cx="12" cy="13" r="3" fill="#818CF8" />
        <text x="24" y="17" font-family="sans-serif" font-size="10" font-weight="600" fill="#ECFDF5">Client Event SDK (/sdk.js)</text>
      </g>
      <!-- Node 4: Dynamic QR -->
      <g transform="translate(690, 0)">
        <rect width="280" height="26" rx="4" fill="#08201A" stroke="#1E5C4A" stroke-width="0.8" />
        <circle cx="12" cy="13" r="3" fill="#F59E0B" />
        <text x="24" y="17" font-family="sans-serif" font-size="10" font-weight="600" fill="#ECFDF5">Branded QR Engine (Branch Tagged)</text>
      </g>
    </g>
  </g>

  <!-- Flow Conduits Tier 1 -> Tier 2 -->
  <g transform="translate(36, 120)">
    <line x1="120" y1="0" x2="120" y2="28" stroke="#195443" stroke-width="1.5" class="conduit-flow" />
    <line x1="340" y1="0" x2="340" y2="28" stroke="#195443" stroke-width="1.5" class="conduit-flow" />
    <line x1="570" y1="0" x2="570" y2="28" stroke="#195443" stroke-width="1.5" class="conduit-flow" />
    <line x1="830" y1="0" x2="830" y2="28" stroke="#195443" stroke-width="1.5" class="conduit-flow" />
  </g>

  <!-- ==================== TIER 2: ZERO-FRAMEWORK GATEWAY (Y: 148, H: 80) ==================== -->
  <g transform="translate(36, 148)">
    <rect width="1028" height="80" rx="8" fill="url(#tier-panel-grad)" stroke="#19473B" stroke-width="1.2" />
    <text x="20" y="20" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#38BDF8">TIER 2 • ZERO-FRAMEWORK GATEWAY (node:http)</text>
    
    <g transform="translate(20, 30)">
      <!-- Module 1: Rate Limiter & Auth -->
      <g transform="translate(0, 0)">
        <rect width="220" height="36" rx="5" fill="#09201A" stroke="#1B5544" stroke-width="1" />
        <text x="14" y="16" font-family="sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">Rate Limiting &amp; Auth</text>
        <text x="14" y="28" font-family="ui-monospace, monospace" font-size="8.5" fill="#6EE7B7">Timing-Safe Verification</text>
      </g>
      <!-- Module 2: Body Reader & Validation -->
      <g transform="translate(240, 0)">
        <rect width="230" height="36" rx="5" fill="#09201A" stroke="#1B5544" stroke-width="1" />
        <text x="14" y="16" font-family="sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">Stream Body Reader</text>
        <text x="14" y="28" font-family="ui-monospace, monospace" font-size="8.5" fill="#7DD3FC">413 Strict Payload Bound</text>
      </g>
      <!-- Module 3: Security & Session Hashing -->
      <g transform="translate(490, 0)">
        <rect width="240" height="36" rx="5" fill="#09201A" stroke="#1B5544" stroke-width="1" />
        <text x="14" y="16" font-family="sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">Session Hash &amp; Salted IP</text>
        <text x="14" y="28" font-family="ui-monospace, monospace" font-size="8.5" fill="#C7D2FE">Zero-Trust Privacy Seal</text>
      </g>
      <!-- Module 4: Static Compressor -->
      <g transform="translate(750, 0)">
        <rect width="230" height="36" rx="5" fill="#09201A" stroke="#1B5544" stroke-width="1" />
        <text x="14" y="16" font-family="sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">Gzip / Deflate Compressor</text>
        <text x="14" y="28" font-family="ui-monospace, monospace" font-size="8.5" fill="#FCD34D">ETag Cache Revalidation</text>
      </g>
    </g>
  </g>

  <!-- Conduit Tier 2 -> Tier 3 -->
  <g transform="translate(36, 228)">
    <line x1="514" y1="0" x2="514" y2="30" stroke="#10B981" stroke-width="2" class="conduit-flow" />
    <g class="packet-flow" transform="translate(514, 0)">
      <circle cx="0" cy="0" r="4" fill="#34D399" />
    </g>
  </g>

  <!-- ==================== TIER 3 & 4: DUAL-STORE ENGINE (Y: 258, H: 175) ==================== -->
  <g transform="translate(36, 258)">
    <rect width="1028" height="175" rx="8" fill="url(#tier-panel-grad)" stroke="#19473B" stroke-width="1.2" />

    <!-- Advisory Lock Banner -->
    <g transform="translate(20, 16)" class="lock-beacon">
      <rect width="450" height="24" rx="4" fill="#064E3B" stroke="#34D399" stroke-width="1" />
      <circle cx="14" cy="12" r="3.5" fill="#34D399" />
      <text x="26" y="16" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#ECFDF5">POSTGRES ADVISORY LOCK: 0x464F524D [ACTIVE - SINGLE WRITER REPLICA 1]</text>
    </g>

    <!-- Side-by-Side Dual Store -->
    <!-- Left Store: Synchronous In-Memory (RAM) -->
    <g transform="translate(20, 50)" class="memory-core">
      <rect width="450" height="108" rx="6" fill="#0A241E" stroke="#1D6350" stroke-width="1.5" />
      <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#34D399">IN-MEMORY DATASTORE (RAM STATE)</text>
      <text x="16" y="42" font-family="ui-monospace, monospace" font-size="9.5" fill="#E2E8F0">36 JSON Collections • Read/Write: &lt;1.0ms</text>
      <text x="16" y="60" font-family="sans-serif" font-size="9.5" fill="#94A3B8">Surveys • Responses • Funnels • Audit Logs • SAML Config</text>
      <!-- Sub-millisecond Tag -->
      <rect x="16" y="74" width="160" height="20" rx="10" fill="#064E3B" />
      <text x="96" y="87.5" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#ECFDF5">SUB-MILLISECOND INGESTION</text>
    </g>

    <!-- Sync Fiber Between In-Memory and PostgreSQL -->
    <g transform="translate(480, 95)">
      <line x1="0" y1="10" x2="65" y2="10" stroke="url(#pg-sync-grad)" stroke-width="2.5" class="conduit-flow" />
      <rect x="5" y="-12" width="55" height="18" rx="3" fill="#08201A" stroke="#1E5C4A" stroke-width="0.8" />
      <text x="32" y="0.5" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" font-weight="700" fill="#38BDF8">5ms DIFF</text>
    </g>

    <!-- Right Store: PostgreSQL Relational Persistence -->
    <g transform="translate(558, 50)">
      <rect width="450" height="108" rx="6" fill="#0A202A" stroke="#1E4D63" stroke-width="1.5" />
      <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#38BDF8">POSTGRESQL RELATIONAL ENGINE</text>
      <text x="16" y="42" font-family="ui-monospace, monospace" font-size="9.5" fill="#E2E8F0">39 Relational Tables • 13 Performance Indexes</text>
      <text x="16" y="60" font-family="sans-serif" font-size="9.5" fill="#94A3B8">Selective JSON Diffs • Atomic Upserts • Append-Only Logs</text>
      <!-- Shadow Diff Tag -->
      <rect x="16" y="74" width="170" height="20" rx="10" fill="#0C3449" />
      <text x="101" y="87.5" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#7DD3FC">SHADOW RELATIONAL BACKFILL</text>
    </g>
  </g>

  <!-- Conduit Tier 4 -> Tier 5 -->
  <g transform="translate(36, 433)">
    <line x1="514" y1="0" x2="514" y2="28" stroke="#818CF8" stroke-width="2" class="conduit-flow" />
  </g>

  <!-- ==================== TIER 5: BACKGROUND WORKERS & PROVIDERS (Y: 461, H: 85) ==================== -->
  <g transform="translate(36, 461)">
    <rect width="1028" height="85" rx="8" fill="url(#tier-panel-grad)" stroke="#19473B" stroke-width="1.2" />
    <text x="20" y="20" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#A78BFA">TIER 5 • ASYNCHRONOUS WORKERS &amp; ENTERPRISE PROVIDERS</text>

    <g transform="translate(20, 30)">
      <!-- BullMQ / In-Process Runner -->
      <g transform="translate(0, 0)">
        <rect width="220" height="42" rx="5" fill="#09201A" stroke="#1B5544" stroke-width="1" />
        <text x="14" y="18" font-family="sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">Job Queue Engine</text>
        <text x="14" y="32" font-family="ui-monospace, monospace" font-size="8.5" fill="#6EE7B7">BullMQ / In-Process Runner</text>
      </g>
      <!-- OpenAI Theme Clustering -->
      <g transform="translate(240, 0)">
        <rect width="230" height="42" rx="5" fill="#09201A" stroke="#1B5544" stroke-width="1" />
        <text x="14" y="18" font-family="sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">AI Sentiment Clustering</text>
        <text x="14" y="32" font-family="ui-monospace, monospace" font-size="8.5" fill="#7DD3FC">GPT-4o-mini Stratified Sample</text>
      </g>
      <!-- AWS S3 / Cloudflare R2 -->
      <g transform="translate(490, 0)">
        <rect width="240" height="42" rx="5" fill="#09201A" stroke="#1B5544" stroke-width="1" />
        <text x="14" y="18" font-family="sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">Quarantine Storage</text>
        <text x="14" y="32" font-family="ui-monospace, monospace" font-size="8.5" fill="#C7D2FE">AWS S3 / Cloudflare R2 SigV4</text>
      </g>
      <!-- Stripe & Razorpay Billing -->
      <g transform="translate(750, 0)">
        <rect width="230" height="42" rx="5" fill="#09201A" stroke="#1B5544" stroke-width="1" />
        <text x="14" y="18" font-family="sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">Enterprise Billing Hub</text>
        <text x="14" y="32" font-family="ui-monospace, monospace" font-size="8.5" fill="#FCD34D">Stripe &amp; Razorpay Lifecycle</text>
      </g>
    </g>
  </g>
</svg>
