<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="act-bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0F241F" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#060E0C" />
    </radialGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#122A24" />
      <stop offset="100%" stop-color="#0A1815" />
    </linearGradient>
    <linearGradient id="stream-pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.1" />
    </linearGradient>

    <filter id="toast-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <style>
      @keyframes select-star {
        0%, 25% { transform: scale(1); fill: #1E3D35; }
        35%, 100% { transform: scale(1.15); fill: #F59E0B; }
      }
      @keyframes select-tag {
        0%, 35% { fill: #132A24; stroke: #235245; }
        45%, 100% { fill: #064E3B; stroke: #34D399; }
      }
      @keyframes pulse-submit {
        0%, 55% { transform: scale(1); }
        60% { transform: scale(0.96); filter: brightness(1.2); }
        65%, 100% { transform: scale(1); }
      }
      @keyframes flow-packet {
        0%, 65% { transform: translateX(0px); opacity: 0; }
        70% { opacity: 1; }
        85% { transform: translateX(170px); opacity: 1; }
        90%, 100% { transform: translateX(170px); opacity: 0; }
      }
      @keyframes alert-toast-slide {
        0%, 72% { transform: translateY(18px); opacity: 0; }
        78%, 94% { transform: translateY(0px); opacity: 1; }
        98%, 100% { transform: translateY(-8px); opacity: 0; }
      }
      @keyframes count-tick {
        0%, 80% { opacity: 1; }
        82% { opacity: 0.2; transform: translateY(-3px); }
        86%, 100% { opacity: 1; transform: translateY(0px); }
      }

      .star-10 {
        transform-origin: 320px 185px;
        animation: select-star 7s ease-in-out infinite;
      }
      .tag-anim {
        animation: select-tag 7s ease-in-out infinite;
      }
      .btn-submit {
        transform-origin: 235px 335px;
        animation: pulse-submit 7s ease-in-out infinite;
      }
      .stream-packet {
        animation: flow-packet 7s linear infinite;
      }
      .alert-toast {
        animation: alert-toast-slide 7s ease-out infinite;
      }
      .counter-val {
        animation: count-tick 7s ease-out infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .star-10, .tag-anim, .btn-submit, .stream-packet, .alert-toast, .counter-val {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="980" height="440" rx="14" fill="#070E0C" />
  <rect width="980" height="440" rx="14" fill="url(#act-bg)" />
  <rect width="980" height="440" rx="14" stroke="#16382E" stroke-width="1.2" />

  <!-- Top Ribbon Header -->
  <g transform="translate(40, 32)">
    <circle cx="6" cy="6" r="5" fill="#10B981" />
    <text x="22" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#34D399" letter-spacing="1">LIVE PRODUCT ENGINE</text>
    <text x="200" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748B">From mobile public submission to multi-branch analytics &amp; alert dispatch in &lt;15ms</text>
  </g>

  <!-- ==================== LEFT PANEL: MOBILE/WEB RESPONDENT ==================== -->
  <g transform="translate(40, 65)">
    <!-- Device Frame -->
    <rect width="390" height="340" rx="12" fill="url(#card-grad)" stroke="#1F473B" stroke-width="1.2" />

    <!-- Survey Header -->
    <rect x="0" y="0" width="390" height="52" rx="12" fill="#0C201A" />
    <circle cx="28" cy="26" r="10" fill="#10B981" />
    <text x="24" y="30" font-family="sans-serif" font-size="10" font-weight="800" fill="#FFFFFF">F</text>
    <text x="48" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F1F5F9">Bengaluru Central Clinic</text>
    <text x="48" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#64748B">Patient Consultation Feedback • Branch #04</text>
    <rect x="300" y="18" width="70" height="18" rx="9" fill="#064E3B" />
    <text x="335" y="30" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" font-weight="600" fill="#34D399">AUTOSAVE</text>

    <!-- Question 1: NPS Rating -->
    <text x="24" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#E2E8F0">1. How likely are you to recommend us?</text>
    <text x="24" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#64748B">0 = Not likely, 10 = Extremely likely</text>

    <!-- Rating scale pills (0 to 10) -->
    <g transform="translate(24, 110)">
      <!-- 7 -->
      <rect x="180" y="0" width="26" height="26" rx="4" fill="#142B24" stroke="#1E473C" stroke-width="1" />
      <text x="193" y="17" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94A3B8">7</text>
      <!-- 8 -->
      <rect x="214" y="0" width="26" height="26" rx="4" fill="#142B24" stroke="#1E473C" stroke-width="1" />
      <text x="227" y="17" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94A3B8">8</text>
      <!-- 9 -->
      <rect x="248" y="0" width="26" height="26" rx="4" fill="#142B24" stroke="#1E473C" stroke-width="1" />
      <text x="261" y="17" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94A3B8">9</text>
      <!-- 10 (Target Animated Selection) -->
      <g class="star-10">
        <rect x="282" y="0" width="32" height="26" rx="4" fill="#059669" stroke="#34D399" stroke-width="1.5" />
        <text x="298" y="17" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">10</text>
      </g>
    </g>

    <!-- Question 2: Tags & Key Drivers -->
    <text x="24" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#E2E8F0">2. Key consultation highlights:</text>

    <g transform="translate(24, 185)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="128" height="24" rx="12" fill="#064E3B" stroke="#34D399" stroke-width="1" class="tag-anim" />
      <text x="64" y="16" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#ECFDF5">✓ Dr. Ramanathan</text>

      <!-- Tag 2 -->
      <rect x="136" y="0" width="105" height="24" rx="12" fill="#064E3B" stroke="#34D399" stroke-width="1" class="tag-anim" />
      <text x="188" y="16" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#ECFDF5">✓ Zero Wait Time</text>

      <!-- Tag 3 -->
      <rect x="249" y="0" width="85" height="24" rx="12" fill="#132A24" stroke="#235245" stroke-width="1" />
      <text x="291" y="16" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#94A3B8">Pharmacy</text>
    </g>

    <!-- Live Verified Submission Button -->
    <g class="btn-submit" transform="translate(24, 235)">
      <rect width="342" height="36" rx="8" fill="#10B981" />
      <text x="171" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#042F24" letter-spacing="0.5">SUBMIT FEEDBACK →</text>
    </g>

    <!-- Trust & Privacy Footnote -->
    <g transform="translate(24, 290)">
      <circle cx="4" cy="4" r="3" fill="#34D399" />
      <text x="14" y="7" font-family="ui-monospace, monospace" font-size="9" fill="#6EE7B7">Anonymous mode: IP Hash SHA-256 • Zero Tracking Cookie</text>
      <text x="14" y="22" font-family="ui-monospace, monospace" font-size="9" fill="#4B6A60">Latency: 9ms • EICAR Clean • AES Storage</text>
    </g>
  </g>

  <!-- ==================== CENTER: PIPELINE TELEMETRY BEAM ==================== -->
  <g transform="translate(440, 160)">
    <!-- Stream Conduit -->
    <line x1="0" y1="50" x2="160" y2="50" stroke="#183E34" stroke-width="3" stroke-dasharray="6, 6" />
    <path d="M 0 50 L 160 50" stroke="url(#stream-pulse)" stroke-width="3" />

    <!-- Floating Packet (Animates across) -->
    <g class="stream-packet">
      <circle cx="0" cy="50" r="10" fill="#10B981" />
      <circle cx="0" cy="50" r="4" fill="#FFFFFF" />
      <text x="0" y="32" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#34D399">NPS=10</text>
      <text x="0" y="72" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#94A3B8">BLR #04</text>
    </g>

    <!-- Micro Pipeline Nodes -->
    <g transform="translate(80, 50)">
      <circle cx="0" cy="0" r="14" fill="#0B1C17" stroke="#34D399" stroke-width="1.2" />
      <text x="0" y="3.5" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" font-weight="800" fill="#34D399">SYNC</text>
      <text x="0" y="-22" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8.5" fill="#64748B">RAM State</text>
      <text x="0" y="28" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8.5" fill="#64748B">PG Shadow</text>
    </g>
  </g>

  <!-- ==================== RIGHT PANEL: OPERATOR HQ & ALERT DISPATCH ==================== -->
  <g transform="translate(610, 65)">
    <!-- Dashboard Frame -->
    <rect width="330" height="340" rx="12" fill="url(#card-grad)" stroke="#1F473B" stroke-width="1.2" />

    <!-- Workspace Header -->
    <rect x="0" y="0" width="330" height="48" rx="12" fill="#0C201A" />
    <text x="20" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F1F5F9">Workspace Telemetry</text>
    <rect x="235" y="16" width="75" height="18" rx="9" fill="#064E3B" />
    <text x="272" y="28" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" font-weight="600" fill="#34D399">REAL-TIME</text>

    <!-- Metric Row -->
    <g transform="translate(20, 68)">
      <!-- Metric 1: Total Responses -->
      <g>
        <text x="0" y="12" font-family="sans-serif" font-size="10" font-weight="600" fill="#94A3B8">TOTAL RESPONSES</text>
        <text class="counter-val" x="0" y="36" font-family="sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">48,290</text>
      </g>
      <!-- Metric 2: Live NPS -->
      <g transform="translate(150, 0)">
        <text x="0" y="12" font-family="sans-serif" font-size="10" font-weight="600" fill="#94A3B8">BRANCH NPS</text>
        <text x="0" y="36" font-family="sans-serif" font-size="20" font-weight="800" fill="#34D399">+74.2</text>
      </g>
    </g>

    <!-- NPS Breakdown Mini Bar -->
    <g transform="translate(20, 126)">
      <rect x="0" y="0" width="290" height="6" rx="3" fill="#1F3C34" />
      <rect x="0" y="0" width="220" height="6" rx="3" fill="#10B981" />
      <rect x="222" y="0" width="50" height="6" fill="#F59E0B" />
      <rect x="274" y="0" width="16" height="6" rx="3" fill="#EF4444" />
      <text x="0" y="20" font-family="ui-monospace, monospace" font-size="9" fill="#6EE7B7">78% Promoters</text>
      <text x="160" y="20" font-family="ui-monospace, monospace" font-size="9" fill="#FBBF24">18% Passives</text>
      <text x="245" y="20" font-family="ui-monospace, monospace" font-size="9" fill="#F87171">4% Detr</text>
    </g>

    <!-- Dynamic Alert Dispatch Box (Animated Slide In) -->
    <g class="alert-toast" transform="translate(16, 175)" filter="url(#toast-shadow)">
      <rect width="298" height="92" rx="8" fill="#0D2721" stroke="#34D399" stroke-width="1.2" />

      <!-- Notification Header -->
      <circle cx="20" cy="22" r="7" fill="#10B981" />
      <text x="17" y="25" font-family="sans-serif" font-size="9" font-weight="900" fill="#052E24">⚡</text>
      <text x="34" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#6EE7B7">INSTANT ALERT TRIGGERED</text>
      <text x="250" y="26" font-family="ui-monospace, monospace" font-size="9" fill="#94A3B8">just now</text>

      <!-- Alert Payload -->
      <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" fill="#FFFFFF">VIP Patient Feedback — BLR #04</text>
      <text x="16" y="64" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#94A3B8">NPS: 10/10 • Tags: Dr. Ramanathan, Zero Wait</text>

      <!-- Channel Badges -->
      <rect x="16" y="72" width="70" height="14" rx="4" fill="#064E3B" />
      <text x="51" y="82" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="700" fill="#34D399">WhatsApp Sent</text>
      <rect x="92" y="72" width="60" height="14" rx="4" fill="#143A31" />
      <text x="122" y="82" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="600" fill="#5EEAD4">Slack Sync</text>
      <rect x="158" y="72" width="65" height="14" rx="4" fill="#143A31" />
      <text x="190" y="82" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="600" fill="#93C5FD">CRM Enriched</text>
    </g>

    <!-- Super-Admin Readiness Pill -->
    <g transform="translate(20, 290)">
      <rect width="290" height="26" rx="6" fill="#0A1C17" stroke="#163E32" stroke-width="1" />
      <circle cx="16" cy="13" r="3.5" fill="#10B981" />
      <text x="26" y="17" font-family="ui-monospace, monospace" font-size="9" fill="#94A3B8">Advisory Lock: <tspan fill="#34D399">Active</tspan> • Worker Queue: <tspan fill="#34D399">Healthy</tspan></text>
    </g>
  </g>
</svg>