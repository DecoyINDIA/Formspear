<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 480" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="pia-bg-glow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0F2922" stop-opacity="0.75" />
      <stop offset="60%" stop-color="#071713" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#040907" />
    </radialGradient>
    <linearGradient id="card-inner-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D241D" />
      <stop offset="100%" stop-color="#061410" />
    </linearGradient>
    <linearGradient id="fiber-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#34D399" stop-opacity="1" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.2" />
    </linearGradient>

    <filter id="toast-drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <style>
      /* Timeline: 8s cyclic loop */
      /* 0.0s - 1.8s: Idle and Score 10 selected */
      /* 2.0s - 3.2s: Tag selected */
      /* 3.5s - 4.2s: Submit clicked */
      /* 4.3s - 5.5s: Packet flies across center */
      /* 5.6s - 8.0s: Counter ticks, new row cascades, alert toast pops */

      @keyframes star-select-anim {
        0%, 15% { fill: #132C24; stroke: #204B3E; transform: scale(1); }
        22%, 100% { fill: #F59E0B; stroke: #FCD34D; transform: scale(1.18); }
      }
      @keyframes tag-toggle-anim {
        0%, 25% { fill: #0B1E19; stroke: #194638; }
        35%, 100% { fill: #064E3B; stroke: #34D399; }
      }
      @keyframes submit-press-anim {
        0%, 42% { transform: scale(1); }
        45% { transform: scale(0.96); filter: brightness(1.25); }
        48%, 100% { transform: scale(1); }
      }
      @keyframes packet-transmit {
        0%, 48% { transform: translateX(0px); opacity: 0; }
        50% { opacity: 1; }
        66% { transform: translateX(115px); opacity: 1; }
        70%, 100% { transform: translateX(115px); opacity: 0; }
      }
      @keyframes counter-increment {
        0%, 65% { opacity: 1; }
        67% { opacity: 0.2; transform: translateY(-3px); }
        70%, 100% { opacity: 1; transform: translateY(0px); }
      }
      @keyframes row-cascade-in {
        0%, 66% { opacity: 0; transform: translateY(-8px); }
        72%, 100% { opacity: 1; transform: translateY(0px); }
      }
      @keyframes alert-toast-appear {
        0%, 70% { opacity: 0; transform: translateY(16px); }
        76%, 95% { opacity: 1; transform: translateY(0px); }
        100% { opacity: 0.85; transform: translateY(0px); }
      }

      .star-active {
        transform-origin: 360px 170px;
        animation: star-select-anim 8s ease-in-out infinite;
      }
      .tag-active {
        animation: tag-toggle-anim 8s ease-in-out infinite;
      }
      .submit-btn {
        transform-origin: 245px 395px;
        animation: submit-press-anim 8s ease-in-out infinite;
      }
      .pulse-packet {
        animation: packet-transmit 8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .counter-tick {
        animation: counter-increment 8s ease-out infinite;
      }
      .row-flash {
        animation: row-cascade-in 8s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }
      .alert-toast-box {
        animation: alert-toast-appear 8s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .star-active, .tag-active, .submit-btn, .pulse-packet, .counter-tick, .row-flash, .alert-toast-box {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Canvas Frame -->
  <rect width="1060" height="480" rx="16" fill="#040907" />
  <rect width="1060" height="480" rx="16" fill="url(#pia-bg-glow)" />
  <rect width="1060" height="480" rx="16" stroke="#16382E" stroke-width="1.2" />

  <!-- Instrument Header Bar -->
  <g transform="translate(36, 26)">
    <circle cx="6" cy="6" r="4.5" fill="#10B981" />
    <text x="20" y="10" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#34D399" letter-spacing="1.2">END-TO-END TELEMETRY IN ACTION</text>
    <text x="260" y="10" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500" fill="#64748B">From mobile public submission to multi-branch analytics &amp; alert dispatch in &lt;12ms</text>
  </g>

  <!-- ==================== STAGE 1: PUBLIC RESPONDENT RUNTIME ==================== -->
  <g transform="translate(36, 56)">
    <!-- Browser/Phone Shell -->
    <rect width="420" height="395" rx="12" fill="url(#card-inner-grad)" stroke="#1F4D3F" stroke-width="1.2" />

    <!-- Window Top Header -->
    <rect width="420" height="46" rx="12" fill="#091E18" />
    <circle cx="20" cy="23" r="4" fill="#EF4444" opacity="0.8" />
    <circle cx="34" cy="23" r="4" fill="#F59E0B" opacity="0.8" />
    <circle cx="48" cy="23" r="4" fill="#10B981" opacity="0.8" />
    <rect x="70" y="12" width="220" height="22" rx="4" fill="#051410" stroke="#143A2F" stroke-width="0.8" />
    <text x="82" y="27" font-family="ui-monospace, monospace" font-size="9.5" fill="#6EE7B7">formspear.io/s/bengaluru-cx</text>
    <text x="360" y="27" font-family="sans-serif" font-size="9" font-weight="600" fill="#34D399">PWA ONLINE</text>

    <!-- Survey Content Header -->
    <g transform="translate(24, 64)">
      <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">Patient Experience Survey</text>
      <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#64748B">Apex Healthcare • Indiranagar Branch (BLR)</text>
    </g>

    <!-- Question 1: NPS Rating (0-10) -->
    <g transform="translate(24, 116)">
      <text x="0" y="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#E2E8F0">1. How likely are you to recommend our clinic?</text>
      
      <!-- NPS Buttons 0 to 10 -->
      <g transform="translate(0, 24)">
        <rect x="0" y="0" width="28" height="28" rx="4" fill="#0B1E19" stroke="#194638" stroke-width="0.8" /><text x="14" y="17.5" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94A3B8">0</text>
        <rect x="32" y="0" width="28" height="28" rx="4" fill="#0B1E19" stroke="#194638" stroke-width="0.8" /><text x="46" y="17.5" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94A3B8">1</text>
        <rect x="64" y="0" width="28" height="28" rx="4" fill="#0B1E19" stroke="#194638" stroke-width="0.8" /><text x="78" y="17.5" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94A3B8">2</text>
        <rect x="96" y="0" width="28" height="28" rx="4" fill="#0B1E19" stroke="#194638" stroke-width="0.8" /><text x="110" y="17.5" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94A3B8">3</text>
        <rect x="128" y="0" width="28" height="28" rx="4" fill="#0B1E19" stroke="#194638" stroke-width="0.8" /><text x="142" y="17.5" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94A3B8">4</text>
        <rect x="160" y="0" width="28" height="28" rx="4" fill="#0B1E19" stroke="#194638" stroke-width="0.8" /><text x="174" y="17.5" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94A3B8">5</text>
        <rect x="192" y="0" width="28" height="28" rx="4" fill="#0B1E19" stroke="#194638" stroke-width="0.8" /><text x="206" y="17.5" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94A3B8">6</text>
        <rect x="224" y="0" width="28" height="28" rx="4" fill="#0B1E19" stroke="#194638" stroke-width="0.8" /><text x="238" y="17.5" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94A3B8">7</text>
        <rect x="256" y="0" width="28" height="28" rx="4" fill="#0B1E19" stroke="#194638" stroke-width="0.8" /><text x="270" y="17.5" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94A3B8">8</text>
        <rect x="288" y="0" width="28" height="28" rx="4" fill="#0B1E19" stroke="#194638" stroke-width="0.8" /><text x="302" y="17.5" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94A3B8">9</text>
        <!-- Rating 10 Active Button -->
        <g class="star-active">
          <rect x="320" y="0" width="32" height="28" rx="4" fill="#F59E0B" stroke="#FCD34D" stroke-width="1.2" />
          <text x="336" y="18" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="800" fill="#040907">10</text>
        </g>
      </g>
      <text x="0" y="66" font-family="sans-serif" font-size="9" fill="#F59E0B">★ Extremely Likely (Promoter)</text>
    </g>

    <!-- Question 2: Tags / Multi-Select -->
    <g transform="translate(24, 204)">
      <text x="0" y="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#E2E8F0">2. What impressed you most during your visit?</text>
      
      <g transform="translate(0, 22)">
        <g class="tag-active">
          <rect x="0" y="0" width="124" height="26" rx="13" fill="#064E3B" stroke="#34D399" stroke-width="1" />
          <text x="62" y="17" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#ECFDF5">✓ Fast Consultation</text>
        </g>
        <g class="tag-active" transform="translate(132, 0)">
          <rect x="0" y="0" width="112" height="26" rx="13" fill="#064E3B" stroke="#34D399" stroke-width="1" />
          <text x="56" y="17" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#ECFDF5">✓ Courteous Staff</text>
        </g>
        <g transform="translate(252, 0)">
          <rect x="0" y="0" width="105" height="26" rx="13" fill="#0B1E19" stroke="#194638" stroke-width="0.8" />
          <text x="52" y="17" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94A3B8">+ Clean Facility</text>
        </g>
      </g>
    </g>

    <!-- Question 3: Branch Tagged -->
    <g transform="translate(24, 274)">
      <rect width="372" height="36" rx="6" fill="#061A14" stroke="#134739" stroke-width="0.8" />
      <circle cx="16" cy="18" r="4" fill="#38BDF8" />
      <text x="28" y="22" font-family="sans-serif" font-size="10.5" fill="#94A3B8">Location Auto-Pin:</text>
      <text x="135" y="22" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#38BDF8">BLR_INDIRANAGAR [Hub #04]</text>
    </g>

    <!-- Kinetic Submit Button -->
    <g class="submit-btn" transform="translate(24, 326)">
      <rect width="372" height="42" rx="8" fill="#10B981" />
      <text x="186" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800" fill="#030806" letter-spacing="0.5">SUBMIT FEEDBACK &amp; RESOLVE</text>
    </g>
  </g>

  <!-- ==================== STAGE 2: SUB-MILLISECOND TRANSIT ARTERY ==================== -->
  <g transform="translate(465, 180)">
    <!-- Optical Fiber Artery -->
    <line x1="0" y1="50" x2="115" y2="50" stroke="url(#fiber-beam)" stroke-width="3" />
    <circle cx="0" cy="50" r="4" fill="#10B981" />
    <circle cx="115" cy="50" r="4" fill="#38BDF8" />

    <!-- Animated Data Packet -->
    <g class="pulse-packet">
      <rect x="-10" y="38" width="22" height="24" rx="4" fill="#38BDF8" filter="url(#toast-drop-shadow)" />
      <circle cx="1" cy="50" r="3" fill="#FFFFFF" />
    </g>

    <!-- Telemetry Badges in Transit -->
    <text x="57" y="35" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#34D399">&lt; 1.2ms</text>
    <text x="57" y="75" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8.5" fill="#64748B">RAM INGEST</text>
  </g>

  <!-- ==================== STAGE 3: OPERATOR DASHBOARD & ESCALATION ==================== -->
  <g transform="translate(590, 56)">
    <!-- Dashboard Outer Frame -->
    <rect width="434" height="395" rx="12" fill="url(#card-inner-grad)" stroke="#1F4D3F" stroke-width="1.2" />

    <!-- Dashboard Top Bar -->
    <rect width="434" height="46" rx="12" fill="#091E18" />
    <text x="18" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">OPERATOR COMMAND DECK</text>
    <rect x="330" y="14" width="86" height="20" rx="10" fill="#064E3B" stroke="#10B981" stroke-width="0.8" />
    <circle cx="342" cy="24" r="3" fill="#34D399" />
    <text x="350" y="27.5" font-family="sans-serif" font-size="9" font-weight="700" fill="#ECFDF5">LIVE STREAM</text>

    <!-- Metrics Row -->
    <g transform="translate(18, 62)">
      <!-- Counter Box -->
      <rect width="186" height="64" rx="8" fill="#071914" stroke="#164336" stroke-width="0.8" />
      <text x="14" y="22" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#94A3B8">TOTAL RESPONSES</text>
      <text x="14" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" class="counter-tick">48,291</text>
      <text x="110" y="46" font-family="sans-serif" font-size="11" font-weight="700" fill="#34D399">+1 LIVE</text>

      <!-- NPS Box -->
      <g transform="translate(198, 0)">
        <rect width="198" height="64" rx="8" fill="#071914" stroke="#164336" stroke-width="0.8" />
        <text x="14" y="22" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#F59E0B">NPS SCORE</text>
        <text x="14" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">+74.2</text>
        <text x="96" y="46" font-family="sans-serif" font-size="10" font-weight="700" fill="#6EE7B7">PROMOTER</text>
      </g>
    </g>

    <!-- Real-Time Activity Log Feed -->
    <g transform="translate(18, 142)">
      <text x="0" y="10" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#64748B">INCOMING RESPONSE FEED</text>

      <!-- Cascading New Record Row -->
      <g class="row-flash" transform="translate(0, 18)">
        <rect width="398" height="42" rx="6" fill="#0A2C21" stroke="#34D399" stroke-width="1.2" />
        <circle cx="16" cy="21" r="4.5" fill="#10B981" />
        <text x="28" y="18" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#FFFFFF">BLR Flagship • Patient #9042</text>
        <text x="28" y="32" font-family="sans-serif" font-size="9.5" fill="#6EE7B7">Score 10 • "Fast Consultation" • Indiranagar</text>
        <rect x="330" y="11" width="56" height="20" rx="4" fill="#047857" />
        <text x="358" y="24.5" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#FFFFFF">JUST NOW</text>
      </g>

      <!-- Prior Row 1 -->
      <g transform="translate(0, 68)">
        <rect width="398" height="38" rx="6" fill="#071914" stroke="#133A2F" stroke-width="0.8" />
        <circle cx="16" cy="19" r="4" fill="#38BDF8" />
        <text x="28" y="17" font-family="sans-serif" font-size="10" font-weight="600" fill="#CBD5E1">BOM South • Lead #9041</text>
        <text x="28" y="30" font-family="sans-serif" font-size="9" fill="#64748B">Score 9 • Mumbai Hub • 14s ago</text>
        <text x="345" y="24" font-family="ui-monospace, monospace" font-size="8.5" fill="#64748B">RESOLVED</text>
      </g>
    </g>

    <!-- Autonomous Escalation Alert Toast -->
    <g class="alert-toast-box" transform="translate(18, 274)" filter="url(#toast-drop-shadow)">
      <rect width="398" height="100" rx="10" fill="#08201A" stroke="#34D399" stroke-width="1.5" />
      
      <!-- Alert Header -->
      <g transform="translate(16, 16)">
        <circle cx="8" cy="8" r="6" fill="#10B981" />
        <path d="M 5 8 L 7 10 L 11 6" stroke="#000" stroke-width="1.2" fill="none" />
        <text x="22" y="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="800" fill="#34D399">AUTONOMOUS ESCALATION DISPATCHED</text>
        <rect x="290" y="-2" width="68" height="18" rx="9" fill="#064E3B" />
        <text x="324" y="10.5" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#6EE7B7">8.4ms LAT</text>
      </g>

      <!-- Alert Payload Summary -->
      <g transform="translate(16, 46)">
        <text x="0" y="12" font-family="sans-serif" font-size="10" fill="#CBD5E1">Target: <tspan font-weight="700" fill="#FFFFFF">WhatsApp Branch Manager</tspan> + <tspan font-weight="700" fill="#38BDF8">Slack #vip-alerts</tspan></text>
        <text x="0" y="28" font-family="sans-serif" font-size="9.5" fill="#94A3B8">Payload: Score 10 Patient VIP • Referral review triggered</text>
        <text x="0" y="42" font-family="ui-monospace, monospace" font-size="8.5" fill="#34D399">HMAC: sha256_b48f...c91a • STATUS: 200 OK</text>
      </g>
    </g>
  </g>
</svg>
