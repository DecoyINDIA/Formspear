name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: formspear_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d formspear_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node --check public/app.js
      - run: node --check public/embed.js
      - run: node --check public/sdk.js
      - run: npm run migrations:check
      - run: npm test
      - run: npm audit --omit=dev
      - name: Redis/BullMQ worker smoke
        env:
          REDIS_WORKER_SMOKE_URL: redis://127.0.0.1:6379
        run: npm run redis:worker:smoke
      - run: npm run performance:budget
      - run: npm run performance:smoke
      - run: npm run backup:smoke
      - name: PostgreSQL relational smoke
        env:
          POSTGRES_RELATIONAL_SMOKE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/formspear_ci
          POSTGRES_RELATIONAL_SMOKE_CONFIRM: I_UNDERSTAND_THIS_RESETS_THE_DATABASE
        run: npm run postgres:relational:smoke
      - name: PostgreSQL backfill drill
        env:
          POSTGRES_BACKFILL_DRILL_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/formspear_ci
          POSTGRES_BACKFILL_DRILL_CONFIRM: I_UNDERSTAND_THIS_RESETS_THE_DATABASE
        run: npm run postgres:backfill:drill
